# SonarCloud configuration.
#
# STATUS: committed and ready, but NOT YET ACTIVE. The `quality` job in
# .github/workflows/ci.yml runs the Sonar scan only when a SONAR_TOKEN secret
# exists, and skips cleanly otherwise - so this file is inert until someone
# completes the enablement steps in
# docs/deployment/GITHUB_ACTIONS_SETUP.md ("Enabling SonarCloud").
#
# The two keys below are PLACEHOLDERS and must be replaced with the real values
# from the SonarCloud project page. They cannot be guessed - projectKey and
# organization are assigned by SonarCloud when the project is created.

sonar.projectKey=CHANGE_ME_sonar_project_key
sonar.organization=CHANGE_ME_sonar_organization
sonar.projectName=cofoundaz-api
sonar.projectVersion=0.1.0

# --- what to analyse -------------------------------------------------------
sonar.sources=app
sonar.tests=tests,e2e
sonar.python.version=3.11
sonar.sourceEncoding=UTF-8

# alembic is generated migration code and is excluded from every other linter in
# this repo (ruff, black, isort, mypy, pylint); excluding it here keeps Sonar's
# verdict consistent with the rest of the toolchain instead of contradicting it.
sonar.exclusions=alembic/**,htmlcov/**,var/**,.worktrees/**

# --- coverage --------------------------------------------------------------
# Produced by the `test` job (`pytest --cov-report=xml`) and passed to this job
# as a workflow artifact, so Sonar reports on the SAME coverage run that gates
# the build rather than recomputing it and disagreeing.
sonar.python.coverage.reportPaths=coverage.xml

# Duplicate-code detection on tests is noise: fixtures and arrange/act/assert
# blocks are legitimately repetitive, and that repetition is what makes tests
# readable.
sonar.cpd.exclusions=tests/**,e2e/**
