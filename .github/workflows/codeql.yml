name: CodeQL

# WHY THIS IS A SEPARATE WORKFLOW AND NOT A JOB IN ci.yml
# -------------------------------------------------------
# CodeQL needs a `schedule:` trigger so the Security tab holds a CURRENT baseline
# rather than only whatever the last PR happened to touch. Advisories are added to
# the query packs continuously, so code that was clean in June can be flagged in
# August without a single line changing.
#
# Putting that cron in ci.yml would run the ENTIRE pipeline weekly - spinning up
# Postgres and Redis service containers, running the e2e suite, and building an
# image - to get one analysis. A separate file gets a separate trigger set and its
# own concurrency group.
#
# WHY CODEQL IS NOT REDUNDANT WITH SEMGREP
# -----------------------------------------
# They fail differently, which is the point of running both:
#
#   Semgrep (in ci.yml `security`) is syntactic PATTERN MATCHING. It is fast and
#   excellent at "this shape of code is wrong" - `verify=False`, a hardcoded key,
#   a dangerous call. It reasons about one place at a time, so it cannot see that
#   an unvalidated path parameter three functions away reaches an open().
#
#   CodeQL builds a relational database of the code and runs INTERPROCEDURAL
#   DATAFLOW / TAINT TRACKING queries over it. It follows a value from a source
#   (a request parameter) through assignments, function boundaries and returns to
#   a sink (a query, a file open, a subprocess), and reports the path. That finds
#   injection and SSRF classes Semgrep structurally cannot, because the source and
#   the sink are never in the same pattern window.
#
# The cost is speed: CodeQL takes minutes where Semgrep takes seconds. That is
# exactly why Semgrep blocks the build and this reports to the Security tab.

on:
  # `develop` only, matching ci.yml. A push to `main` is a fast-forward of an
  # already-analysed `develop` commit, so analysing it again would build the
  # same CodeQL database from the same tree and bill for it; and a PR from
  # `develop` to `main` must run nothing at all (see the trigger table in
  # ci.yml). The weekly cron below is what keeps the Security tab's baseline
  # current, and it is unaffected.
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
    # Mirrors ci.yml exactly, and for the same two reasons. `ready_for_review`
    # is NOT in GitHub's default type list, so without it a PR that is drafted,
    # pushed to, then marked ready would never be analysed at all - the draft
    # guard below would skip every event it did receive. The two must be added
    # together or the guard silently becomes "never run on a PR".
    types: [opened, reopened, ready_for_review, synchronize]
  schedule:
    # Mondays 04:17 UTC. Deliberately not on the hour - GitHub heavily throttles
    # cron at :00, and a delayed weekly baseline is a stale weekly baseline.
    - cron: "17 4 * * 1"

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (python)
    runs-on: ubuntu-latest
    # CodeQL writes results through the code-scanning API, which on a PRIVATE
    # repo requires GitHub Advanced Security. Without it every step fails with
    # "Resource not accessible by integration" - which is exactly what the first
    # real run produced. A job that is red forever teaches people that red is
    # normal, so this SKIPS cleanly instead of failing.
    #
    # It ALSO skips while a pull request is still a draft, matching ci.yml so
    # that "a draft costs nothing" is a property of the whole pipeline rather
    # than of one file. That guard is currently invisible - on this private repo
    # the GHAS condition already skips the job on every event, so a draft costs
    # nothing today either way. It stops being invisible the moment code
    # scanning is enabled, at which point drafts would otherwise start billing
    # CodeQL minutes with no one having changed anything.
    #
    # It turns itself back on when either becomes true:
    #   - the repository is made PUBLIC (code scanning is free on public repos), or
    #   - the repository variable ENABLE_CODE_SCANNING is set to "true" after
    #     purchasing GHAS.
    #
    # Nothing else needs changing. See docs/deployment/GITHUB_ACTIONS_SETUP.md.
    #
    # NOTE: CodeQL is the ONLY scanner affected this way. Semgrep, bandit,
    # gitleaks, pip-audit, Trivy and Checkov all run on their own exit codes and
    # keep blocking the build with or without GHAS - only their Security-tab
    # upload is lost.
    if: >-
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false) &&
      (github.event.repository.private == false || vars.ENABLE_CODE_SCANNING == 'true')
    # CodeQL on a large repo can outrun the 6h default; this fails fast instead.
    timeout-minutes: 30
    permissions:
      contents: read
      # Required to publish results to the Security tab.
      security-events: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          languages: python
          # `security-and-quality` = the security suite PLUS maintainability and
          # correctness queries. The default `security` suite alone would miss the
          # quality half, and this repo has no other interprocedural analysis.
          queries: security-and-quality
          # Python needs no compilation, so CodeQL uses its `none` build mode and
          # extracts directly from source - no build step required below.

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          category: "/language:python"
          # REPORT-ONLY, by design. This job does not gate the build.
          #
          # A brand-new CodeQL rollout has no triaged baseline, and the
          # `security-and-quality` suite is broad. Blocking merges on its first
          # run is how teams end up disabling CodeQL within a fortnight. Findings
          # land in the Security tab and on PR diffs, where they can be triaged
          # and dismissed with a reason.
          #
          # Promote to blocking once the baseline is triaged: add
          # `github/codeql-action/upload-sarif` with a failure threshold, or turn
          # on branch protection's code-scanning requirement for this category.
          upload: always
