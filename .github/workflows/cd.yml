name: CD

# Build once -> deploy staging -> gate on live staging E2E -> deploy production.
#
#   build-and-push  ->  staging-deploy  ->  staging-e2e  ->  production-deploy
#
# The image is built ONE time and deployed by immutable digest, to BOTH
# environments. Staging and production therefore run byte-identical artifacts;
# the only difference is which `.env` each receives. Rebuilding per environment -
# or deploying `latest` - would mean the thing E2E approved is not provably the
# thing production runs.
#
# DELIBERATE DEVIATION FROM THE TEMPLATE: the template scp's a `docker save`
# tarball to each host. We keep GHCR + digest pull instead, because a digest is
# content-addressed (the registry cannot serve different bytes under it) and
# because the SBOM and SLSA provenance attestations BuildKit pushes alongside the
# manifest have nowhere to live in a tarball. The cost is a GHCR credential on
# each VPS and a network dependency on ghcr.io at deploy time.
#
# Per-environment secrets - including DEPLOY_PATH - come from GitHub
# Environments, so no server path appears anywhere in this repository. That is
# on purpose: the previously hardcoded path is exactly what went stale.
#
# Secrets are documented in docs/deployment/GITHUB_ACTIONS_SETUP.md.

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:
    # checkov:skip=CKV_GHA_7:Input cannot affect build output - see reasoning below.
    #
    # CKV_GHA_7 requires workflow_dispatch inputs to be empty, because an input
    # that influences a build breaks the SLSA guarantee that the build output is
    # determined solely by the source. That does not apply here, and the design
    # makes it structurally impossible rather than merely unlikely:
    #
    #   1. `build-and-push` is SKIPPED whenever image_tag is set
    #      (`if: github.event.inputs.image_tag == ''`). When this input has a
    #      value, no build runs at all - so no build output exists for it to
    #      affect. The input only selects an ALREADY-BUILT image.
    #   2. The image reference is assembled from the trusted `${REGISTRY}` and
    #      `${IMAGE_NAME}` env values; the input supplies only the tag portion.
    #      It cannot redirect the pull to a different registry or repository.
    #   3. The assembled reference is regex-validated before use, and the tag
    #      character class excludes `/` and `@`, so it cannot break out of the
    #      repository path.
    #   4. workflow_dispatch requires write access on the repository.
    #
    # This input is the manual rollback path (docs/deployment/ROLLBACK.md).
    # Removing it to satisfy the check would delete the rollback mechanism and
    # make the system less safe, not more.
    inputs:
      image_tag:
        description: >-
          Deploy an EXISTING GHCR tag instead of building (e.g. sha-a1b2c3d).
          This is the manual rollback path - see docs/deployment/ROLLBACK.md.
        required: false
        type: string

concurrency:
  # One pipeline at a time. Two runs would fight over the same `.env` on each
  # box and could interleave `compose up` calls.
  # cancel-in-progress is FALSE on purpose - cancelling a half-finished deploy
  # leaves a VPS in an unknown state, which is worse than queueing.
  group: cd-pipeline
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ------------------------------------------------------------------------- #
  build-and-push:
    name: Build & push to GHCR
    runs-on: ubuntu-latest
    # Skip the build entirely when redeploying an existing tag (rollback).
    if: github.event.inputs.image_tag == ''
    permissions:
      contents: read
      packages: write
    outputs:
      image_ref: ${{ steps.ref.outputs.image_ref }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & push
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
            VERSION=${{ github.ref_type == 'tag' && github.ref_name || format('sha-{0}', github.sha) }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # BuildKit attaches a SLSA provenance attestation (what built this, from
          # which commit, with which inputs) and an SBOM attestation to the pushed
          # manifest. Both travel WITH the image in GHCR and can be read back with
          # `docker buildx imagetools inspect --format '{{ json .Provenance }}'`.
          provenance: true
          sbom: true
          #
          # DELIBERATELY NOT ADDING cosign KEYLESS SIGNING.
          # A signature is only worth the verification step that enforces it, and
          # for this topology there is nothing left for it to prove: CD resolves
          # the digest from the build it just ran and the VPS pulls THAT digest.
          # A digest is content-addressed, so the registry cannot serve different
          # bytes under it - which is the exact tampering a signature would catch.
          # Without an admission controller or a `cosign verify` gate that can
          # actually refuse a deploy, signing here is ceremony that looks like
          # security. Revisit if images are ever consumed by a third party, or if
          # a policy engine enters the picture.

      - name: Resolve the immutable digest
        id: ref
        # Deploy by DIGEST, not by tag. A tag is a mutable pointer - `sha-abc123`
        # can in principle be re-pushed. A digest is content-addressed, so what
        # the VPS pulls is byte-identical to what was just built and scanned.
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          # github.repository preserves the repository's own casing
          # ("innocent98/Cofoundaz-api"), but a Docker reference's path component
          # MUST be lowercase. docker/metadata-action lowercases it silently when
          # deriving tags, so the PUSH lands at .../cofoundaz-api while a ref built
          # from the raw variable names .../Cofoundaz-api -- malformed AND
          # nonexistent. That mismatch failed the first real CD run.
          #
          # `tr` rather than bash's ${VAR,,}: the latter needs bash 4+, so it
          # cannot be exercised on a macOS dev machine (bash 3.2) and silently
          # breaks under sh. This form is portable and locally testable.
          IMAGE_LC="$(printf '%s' "${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')"
          IMAGE_REF="${REGISTRY}/${IMAGE_LC}@${DIGEST}"
          echo "image_ref=${IMAGE_REF}" >> "$GITHUB_OUTPUT"
          echo "Deploying image: ${IMAGE_REF}"

  # ------------------------------------------------------------------------- #
  staging-deploy:
    name: Deploy to staging
    runs-on: ubuntu-latest
    needs: [build-and-push]
    # `always()` keeps the rollback path alive (workflow_dispatch with an
    # image_tag skips build-and-push). The explicit checks stop a FAILED build
    # from ever reaching a VPS.
    if: always() && needs.build-and-push.result != 'failure' && needs.build-and-push.result != 'cancelled'
    environment:
      name: staging
      url: ${{ vars.APP_URL }}
    outputs:
      image_ref: ${{ steps.target.outputs.image_ref }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Choose the image to deploy
        id: target
        env:
          BUILT_REF: ${{ needs.build-and-push.outputs.image_ref }}
          MANUAL_TAG: ${{ github.event.inputs.image_tag }}
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
        run: |
          set -euo pipefail
          if [ -n "${MANUAL_TAG}" ]; then
            # Lowercased for the same reason as the digest path in
            # build-and-push: the registry holds .../cofoundaz-api, never
            # .../Cofoundaz-api.
            IMAGE_LC="$(printf '%s' "${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')"
            REF="${REGISTRY}/${IMAGE_LC}:${MANUAL_TAG}"
            echo "Manual deploy (rollback path) of ${REF}"
          else
            REF="${BUILT_REF}"
            echo "Deploying freshly built ${REF}"
          fi
          if [ -z "${REF}" ]; then
            echo "::error::No image reference resolved - refusing to deploy."
            exit 1
          fi
          # Defence in depth: workflow_dispatch input is operator-supplied text
          # that ends up in a `docker pull` on the VPS. Constrain it to the shape
          # of a real image reference before it leaves this runner.
          if ! printf '%s' "${REF}" | grep -qE '^[a-z0-9./_-]+(:[A-Za-z0-9._-]+|@sha256:[a-f0-9]{64})$'; then
            echo "::error::Refusing to deploy malformed image reference: ${REF}"
            exit 1
          fi
          echo "image_ref=${REF}" >> "$GITHUB_OUTPUT"

      - name: Deploy the staging stack
        uses: ./.github/actions/deploy-stack
        with:
          environment: staging
          image_ref: ${{ steps.target.outputs.image_ref }}
          vps_host: ${{ secrets.VPS_HOST }}
          vps_username: ${{ secrets.VPS_USERNAME }}
          vps_ssh_key: ${{ secrets.VPS_SSH_KEY }}
          vps_port: ${{ secrets.VPS_PORT || 22 }}
          deploy_path: ${{ secrets.DEPLOY_PATH }}
          env_encryption_key: ${{ secrets.ENV_ENCRYPTION_KEY }}
          ghcr_username: ${{ secrets.GHCR_PULL_USERNAME }}
          ghcr_token: ${{ secrets.GHCR_PULL_TOKEN }}

  # ------------------------------------------------------------------------- #
  staging-e2e:
    name: Live E2E against deployed staging
    runs-on: ubuntu-latest
    needs: [staging-deploy]
    if: needs.staging-deploy.result == 'success'
    environment:
      name: staging
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-python-poetry
        with:
          python-version: "3.11"
          poetry-version: "2.2.1"

      - name: Reset the staging rate limiter
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: DEPLOY_PATH
          script: |
            set -euo pipefail
            cd "${DEPLOY_PATH}"
            # The template flushes rate-limit keys out of Redis. That would be a
            # NO-OP here: this app builds its slowapi Limiter without a
            # storage_uri, so limiter state is MemoryStorage inside each gunicorn
            # worker - verified locally (type(limiter._storage) is MemoryStorage).
            # Restarting the api service is what actually clears it.
            #
            # Without this, a redeploy that reuses warm workers can start the E2E
            # run partway through a 120/minute budget and fail on 429s that have
            # nothing to do with the change under test.
            docker compose -f docker-compose.prod.yml --env-file .env restart api
            # Same sed-not-grep|cut reasoning as .github/actions/deploy-stack:
            # `cut` exits 0 on empty input, so the `||` default never fired and a
            # missing API_PORT yielded `http://127.0.0.1:/...`. Staging runs on
            # 8001, so this value is no longer incidental.
            API_PORT="$(sed -n 's/^API_PORT=//p' .env | tail -n 1)"
            for _ in $(seq 1 40); do
              if curl -fsS --max-time 5 "http://127.0.0.1:${API_PORT:-8000}/api/v1/health/ready" >/dev/null 2>&1; then
                echo "staging api back up after limiter reset"; exit 0
              fi
              sleep 3
            done
            echo "::error::staging api did not come back after the limiter reset"
            exit 1

      - name: Run the live E2E gate
        env:
          # Points the existing e2e/ suite at the DEPLOYED staging API instead of
          # a locally booted uvicorn. Same suite, same assertions.
          E2E_BASE_URL: ${{ vars.APP_URL }}
          # Remote mode: e2e/conftest.py deselects every test whose fixture
          # closure needs the mailbox, because EMAIL_FILE_DIR lives on the VPS
          # and this runner cannot read it. It prints exactly which tests were
          # dropped, and errors out if that would leave nothing to run.
          E2E_REMOTE: "1"
        run: |
          set -euo pipefail
          if [ -z "${E2E_BASE_URL}" ]; then
            echo "::error::APP_URL variable is not set for the staging environment - cannot run the live gate."
            exit 1
          fi
          # -o addopts="" clears the unit-suite defaults from pyproject.toml
          # (coverage, --strict-markers), which do not apply to a remote run.
          poetry run pytest e2e/ -o addopts="" -v -p no:cacheprovider \
            --junitxml=staging-e2e.xml 2>&1 | tee staging-e2e.log
          ec=${PIPESTATUS[0]}

          # A gate that no-ops is worse than no gate. The template treats pytest
          # exit 5 ("no tests collected") as success so projects without an e2e
          # suite are not blocked; we have a suite, so exit 5 here means the
          # selection broke and NOTHING was verified. Fail on it.
          if [ "$ec" -eq 5 ]; then
            echo "::error::pytest collected no tests. The staging gate verified nothing - failing deliberately."
            exit 1
          fi
          exit "$ec"

      - name: Summarise what the gate actually covered
        if: always()
        run: |
          {
            echo "### Live staging E2E"
            echo ""
            if [ -f staging-e2e.log ]; then
              PASSED=$(grep -cE '^e2e/.* PASSED' staging-e2e.log || true)
              DESEL=$(grep -cE 'deselected \(needs local mail dir\)' staging-e2e.log || true)
              echo "| metric | count |"
              echo "|---|---|"
              echo "| ran against deployed staging | ${PASSED:-0} |"
              echo "| deselected (need a local mail dir) | ${DESEL:-0} |"
              echo ""
              echo "Deselected tests do **not** gate production. They need"
              echo "\`EMAIL_FILE_DIR\` on the same machine as the test run, which a"
              echo "remote runner does not have. See docs/deployment/DEPLOYMENT_GUIDE.md."
            else
              echo "No log produced - the job failed before pytest ran."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload E2E artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: staging-e2e
          path: |
            staging-e2e.log
            staging-e2e.xml
          if-no-files-found: warn
          retention-days: 14

  # ------------------------------------------------------------------------- #
  production-deploy:
    name: Deploy to production VPS
    runs-on: ubuntu-latest
    needs: [staging-deploy, staging-e2e]
    # Production is reachable ONLY through a green staging gate. Both conditions
    # are explicit rather than relying on job ordering, so a skipped or cancelled
    # staging-e2e cannot be mistaken for a pass.
    if: needs.staging-deploy.result == 'success' && needs.staging-e2e.result == 'success'

    # The `production` GitHub Environment supplies its own DEPLOY_PATH, VPS_*,
    # and ENV_ENCRYPTION_KEY, and carries the manual approval gate. Configure
    # required reviewers under Settings -> Environments -> production.
    environment:
      name: production
      # A repository/environment VARIABLE, not a secret: the `secrets` context is
      # not available in `environment.url`, and a public base URL is not a secret.
      url: ${{ vars.APP_URL }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Deploy the production stack
        uses: ./.github/actions/deploy-stack
        with:
          environment: production
          # The SAME digest staging just proved. Not a rebuild.
          image_ref: ${{ needs.staging-deploy.outputs.image_ref }}
          vps_host: ${{ secrets.VPS_HOST }}
          vps_username: ${{ secrets.VPS_USERNAME }}
          vps_ssh_key: ${{ secrets.VPS_SSH_KEY }}
          vps_port: ${{ secrets.VPS_PORT || 22 }}
          deploy_path: ${{ secrets.DEPLOY_PATH }}
          env_encryption_key: ${{ secrets.ENV_ENCRYPTION_KEY }}
          ghcr_username: ${{ secrets.GHCR_PULL_USERNAME }}
          ghcr_token: ${{ secrets.GHCR_PULL_TOKEN }}

      - name: Deployment summary
        if: always()
        env:
          IMAGE_REF: ${{ needs.staging-deploy.outputs.image_ref }}
          RESULT: ${{ job.status }}
          COMMIT_SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
        run: |
          {
            echo "### Production deploy: ${RESULT}"
            echo ""
            echo "| field | value |"
            echo "|---|---|"
            echo "| image | \`${IMAGE_REF}\` |"
            echo "| commit | \`${COMMIT_SHA}\` |"
            echo "| actor | ${ACTOR} |"
            echo "| gated by | live staging E2E |"
          } >> "$GITHUB_STEP_SUMMARY"
