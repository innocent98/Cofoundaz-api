name: CI

# COST MODEL - read before adding a job.
#
# This is a PRIVATE repo. GitHub Free bills every job, rounded UP to the minute,
# against a 2,000 min/month allowance. The pipeline was previously 10 jobs at
# ~15 billed minutes per run, firing on BOTH pull_request and push-to-main - so
# one PR-then-merge cycle cost ~30 minutes and re-ran, on main, the exact suite
# that had just passed on the PR. 100+ runs over three days exhausted the
# allowance and every job began failing in 2 seconds with zero steps, which
# looks alarmingly like a code failure and is not one.
#
# So jobs are split by what a given event can actually tell you:
#
#   ALWAYS (push + PR)  lint, test, security      ~5 min
#     The set that must still catch a DIRECT push to `develop` - a typo, a
#     broken test, a secret. A direct push bypasses PR review entirely, so this
#     is the only thing standing between it and a staging deploy. Cheap enough
#     to run unconditionally.
#
#   PR ONLY             quality, migrations, e2e, build   ~+6 min
#     Slower, and re-running them on the merge commit re-tests code that was
#     green minutes earlier. A merge into `develop` additionally triggers
#     cd-staging.yml, whose own build step fails before deploying if the image
#     is broken.
#
# WHERE THIS FILE SITS IN THE BRANCHING MODEL (docs/deployment/BRANCHING.md)
#
#   | event                | this file runs         | other workflows        |
#   |----------------------|------------------------|------------------------|
#   | PR -> develop        | full suite (~11 min)   | -                      |
#   | PR -> develop, draft | NOTHING (0 min)        | -                      |
#   | push develop         | lint/test/security     | cd-staging.yml         |
#   | PR develop -> main   | NOTHING                | NOTHING                |
#   | push main            | NOTHING                | cd-production.yml      |
#
# `main` IS ABSENT FROM THE TRIGGERS ON PURPOSE, and it is not a weakened gate.
# Promotion to `main` is a FAST-FORWARD of `develop` (branch protection on
# `main` requires a linear history), so a commit arriving on `main` carries the
# byte-identical tree that already passed the full suite on the `develop` PR
# and the safety net on the `develop` push. Re-running any of it would test the
# same tree a third time and bill for it. If the fast-forward rule is ever
# relaxed, the tree on `main` stops being the tested tree and this decision has
# to be revisited - though cd-production.yml would refuse to deploy such a
# commit anyway, because no image exists for its SHA.
#
# A PR from `develop` to `main` therefore runs nothing at all, in any workflow.
# That is the intent, not an oversight.
#
# REMOVED, with what each cost and what coverage was lost:
#   sonarcloud  (~1 min)  Inert - it has no SONAR_TOKEN and has never produced
#                         a finding. Re-add it WITH the token or not at all.
#   iac-scan    (~3 min)  trivy fs duplicated pip-audit on the same CVE set;
#                         trivy config returned 0 findings on every run since
#                         the Dockerfile was hardened; Checkov has no
#                         docker_compose framework, so it only ever scanned the
#                         workflows. Real loss: nothing currently scans the two
#                         compose files as IaC - no tool we tried can. trivy
#                         image (the one that finds CVEs that ship) is retained
#                         inside `build`.
#
# DRAFT PRs COST NOTHING. Every job carries a `draft == false` guard, so a PR
# opened as a draft runs no CI at all; marking it ready runs the suite once.
# GitHub does NOT skip drafts on its own - a draft fires `opened` and
# `synchronize` like any other PR - which is why the guard is explicit and why
# `ready_for_review` had to be added to the trigger's type list.
#
# The habit this enables: open work as a draft, push as often as you like for
# free, mark it ready when you want it validated. Repeated pushes to an ALREADY
# READY PR still re-run CI (correctly - the code changed), though
# `cancel-in-progress` below kills superseded runs so rapid pushes cannot stack.
#
# Adding a job costs roughly (its minutes x runs per month). Say so in the PR.

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
    # `ready_for_review` is REQUIRED here. GitHub does NOT exclude draft PRs
    # from pull_request events - a draft still fires `opened` and
    # `synchronize` - so drafts are skipped by an explicit `draft == false`
    # guard on every job below, and marking one ready fires
    # `ready_for_review`, which is NOT in the default type list. Without it a
    # PR drafted, pushed to, then marked ready would never run CI at all.
    types: [opened, reopened, ready_for_review, synchronize]

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded PR runs (pushing three times to a PR should not run three
  # full pipelines). Do NOT cancel on a push to `develop`: that run is the only
  # safety net a direct push gets, and cd-staging.yml is already building and
  # deploying the same commit in parallel. Cancelling it would deploy to staging
  # with the safety net silently unfinished rather than failed.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege by default. Jobs that need more (SARIF upload) opt in locally.
permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"
  POETRY_VERSION: "2.2.1"
  # NOTE: service images are pinned inline in each job below (postgres:17-alpine)
  # rather than via env vars - the `env` context is not available inside a job's
  # `services:` block. Keep them in step with docker-compose.prod.yml by hand.
  # CI previously ran Postgres 15 while production ran 17; a whole major version
  # of behaviour difference was tested nowhere.

jobs:
  # ------------------------------------------------------------------------- #
  lint:
    name: Lint & type-check
    # Runs on every push to `develop`, and on PRs once they leave draft.
    # Drafts cost nothing.
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-python-poetry
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          poetry-version: ${{ env.POETRY_VERSION }}

      - name: black
        run: poetry run black --check app tests

      - name: isort
        run: poetry run isort --check-only app tests

      - name: ruff
        run: poetry run ruff check app tests

      - name: mypy
        # `make lint` has always run mypy; CI never did. That gap let type
        # regressions land on the trunk and only surface for whoever next ran the
        # Makefile target locally. Verified passing on the current tree
        # ("Success: no issues found in 91 source files"), so this is a real
        # gate from day one, not an aspiration.
        run: poetry run mypy app

  # ------------------------------------------------------------------------- #
  test:
    name: Unit tests
    # Runs on every push to `develop`, and on PRs once they leave draft.
    # Drafts cost nothing.
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-python-poetry
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          poetry-version: ${{ env.POETRY_VERSION }}

      - name: Create the pytest database
        # tests/conftest.py drops and recreates every table in TEST_DATABASE_URL,
        # so it must be a different database from the app's.
        env:
          PGPASSWORD: test_password
        run: |
          psql -h localhost -U test_user -d test_db -c "CREATE DATABASE cofoundaz_test;"

      - name: pytest
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db
          TEST_DATABASE_URL: postgresql://test_user:test_password@localhost:5432/cofoundaz_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: ci-secret-key-not-used-outside-ci
          FIRST_SUPERUSER_EMAIL: admin@test.com
          FIRST_SUPERUSER_PASSWORD: testpassword
          LOG_FILE_PATH: ""
        # Threshold is 95, against 98.28% measured on the tree this gate was
        # added to. The gap is deliberate slack: a tight 98 would fail CI for
        # adding a single lightly-covered module, which trains people to lower
        # the number. 95 still fails loudly on a real regression. Raise it when
        # coverage is durably higher, never lower it to make a red build green.
        #
        # JOURNAL_ENCRYPTION_KEY is generated per run rather than stored: the
        # journal tests need a valid Fernet key, but nothing needs that key to
        # survive between runs. GITHUB_ACTIONS_SETUP.md rule 2.
        run: |
          export JOURNAL_ENCRYPTION_KEY="$(poetry run python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')"
          poetry run pytest --cov=app --cov-report=xml --cov-report=term-missing --cov-fail-under=95

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 7

  # ------------------------------------------------------------------------- #
  migrations:
    name: Migrations (fresh DB, round-trip, drift)
    # PR-only, and never while the PR is a draft. See the cost note on top.
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: migrations_db
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://test_user:test_password@localhost:5432/migrations_db
      SECRET_KEY: ci-secret-key-not-used-outside-ci
      FIRST_SUPERUSER_EMAIL: admin@test.com
      FIRST_SUPERUSER_PASSWORD: testpassword
      LOG_FILE_PATH: ""

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-python-poetry
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          poetry-version: ${{ env.POETRY_VERSION }}

      - name: Exactly one alembic head
        # Two heads means two branches of history both claim to be "latest", and
        # `alembic upgrade head` fails at deploy time - on the VPS, mid-deploy,
        # which is the worst possible place to discover it. Usually caused by two
        # PRs each adding a revision off the same parent.
        run: |
          HEADS=$(poetry run alembic heads | grep -c '(head)')
          echo "alembic heads found: $HEADS"
          poetry run alembic heads
          if [ "$HEADS" -ne 1 ]; then
            echo "::error::Expected exactly 1 alembic head, found $HEADS. Merge them with 'alembic merge'."
            exit 1
          fi

      - name: Upgrade from an empty database
        # The deploy-time path. If this fails, the migrate service in
        # docker-compose.prod.yml exits non-zero and the API never starts.
        run: poetry run alembic upgrade head

      - name: Schema matches the models (no un-generated migration)
        # Catches the classic "changed a model, forgot to autogenerate" bug.
        # Without it the drift only surfaces as a runtime UndefinedColumn error
        # in production.
        run: poetry run alembic check

      - name: Downgrade to base, then upgrade again
        # Proves the downgrades are real. All 7 revisions implement genuine
        # downgrade bodies (op.drop_table / op.drop_index, not `pass`), which is
        # what makes the documented rollback procedure trustworthy. A migration
        # you cannot reverse is a one-way door in production.
        run: |
          poetry run alembic downgrade base
          poetry run alembic upgrade head

  # ------------------------------------------------------------------------- #
  e2e:
    name: End-to-end
    # PR-only, and never while the PR is a draft. See the cost note on top.
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-python-poetry
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          poetry-version: ${{ env.POETRY_VERSION }}

      - name: Write a CI .env
        # scripts/e2e_run.sh boots the real app, and app/core/config.py reads
        # .env via Pydantic Settings. The script sets DATABASE_URL / EMAIL_BACKEND
        # itself but not SECRET_KEY or the superuser fields, so Settings would
        # fail to validate without this file. These are throwaway CI values.
        run: |
          cat > .env <<'ENVEOF'
          PROJECT_NAME=cofoundaz-api
          ENVIRONMENT=development
          SECRET_KEY=ci-e2e-secret-key-not-used-outside-ci
          ALGORITHM=HS256
          DATABASE_URL=postgresql://user:password@localhost:5432/cofoundaz-api_db
          REDIS_URL=redis://localhost:6379/0
          FIRST_SUPERUSER_EMAIL=admin@test.com
          FIRST_SUPERUSER_PASSWORD=testpassword
          LOG_FILE_PATH=
          ENVEOF

      - name: Run the e2e suite
        # Drives the project's own runner rather than a CI-only reimplementation,
        # so what CI proves is what a developer reproduces locally with `make e2e`.
        # The script brings up db+redis via `docker compose` (present on
        # ubuntu-latest), migrates a scratch `cofoundaz_e2e` database from zero,
        # boots real uvicorn on :8010, and tears it all down.
        run: ./scripts/e2e_run.sh

      - name: Upload e2e captures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-captures
          path: e2e/_captures/
          retention-days: 7
          if-no-files-found: ignore

  # ------------------------------------------------------------------------- #
  security:
    name: Security (secrets, SAST, dependencies)
    # Runs on every push to `develop`, and on PRs once they leave draft.
    # Drafts cost nothing.
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Needed to publish Semgrep findings to the repository Security tab.
      security-events: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gitleaks scans history, not just the working tree. A secret committed
          # and then "removed" in a later commit is still in the history and still
          # compromised; a shallow clone would miss exactly that case.
          fetch-depth: 0

      - uses: ./.github/actions/setup-python-poetry
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          poetry-version: ${{ env.POETRY_VERSION }}

      # --- 1. Secrets ------------------------------------------------------- #
      - name: gitleaks (committed secrets)
        # Run as a pinned container rather than the marketplace action: the
        # action requires GITLEAKS_LICENSE for organisation-owned repos, and the
        # container has no such condition.
        #
        # `--log-opts HEAD` scopes the scan to the history of the ref being
        # built. It is NOT a weakening of the gate, and the distinction matters:
        #
        #   checkout uses fetch-depth: 0, which fetches every branch and tag -
        #   correct, because a secret committed and "removed" in a later commit
        #   is still in history and still compromised, and a shallow clone would
        #   miss exactly that. But gitleaks defaults to scanning ALL refs in the
        #   object store, not just the branch under test. So one commit on ONE
        #   contributor's unmerged branch failed this job on every branch in the
        #   repo, main included - a red build nobody could explain from their own
        #   diff, pointing at a file their branch never touched.
        #
        # Scoped to HEAD, a branch is judged on its own history. A secret on
        # someone else's branch fails THEIR pull request, which is where it can
        # actually be fixed. Full history of this branch is still scanned.
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            detect --source /repo --redact --verbose --no-banner \
            --log-opts HEAD

      # --- 2. SAST ---------------------------------------------------------- #
      #
      # ORDERING IS LOAD-BEARING: every SCANNER runs before any SARIF upload.
      #
      # The first real CI run proved why. A SARIF upload failed (private repo, no
      # GHAS), and because the upload sat between the scanners, GitHub marked the
      # job failed and SKIPPED every step after it - bandit and pip-audit never
      # ran at all. The job was red, so nothing shipped; but had anyone "fixed"
      # that upload with a bare continue-on-error, the job would have gone GREEN
      # with two blocking security gates silently not executing.
      #
      # Scanners first, uploads last. An upload can then never suppress a gate.
      - name: Semgrep (source patterns)
        run: |
          pipx install semgrep
          semgrep scan \
            --config p/python \
            --config p/security-audit \
            --config p/owasp-top-ten \
            --config p/jwt \
            --config p/secrets \
            --severity ERROR \
            --error \
            --metrics off \
            --sarif --output semgrep.sarif \
            app/

      # --- 3. Python-specific SAST ------------------------------------------ #
      - name: bandit (Python SAST)
        # Complements Semgrep rather than duplicating it. Bandit is Python-aware
        # and ships checks the public Semgrep rulesets do not carry: weak crypto
        # primitives (md5/sha1 for security use), `subprocess` with shell=True,
        # `assert` used for control flow (stripped under `python -O`), insecure
        # tempfile creation, and yaml.load without a SafeLoader.
        #
        # Scoped to app/ - tests legitimately use `assert` everywhere.
        #
        # BLOCKS. Verified clean on the current tree (exit 0). The three original
        # findings were all false positives and carry inline `# nosec <ID>`
        # annotations with written reasons AT THE SITE.
        run: poetry run bandit -r app/ --quiet

      # --- 4. Dependencies -------------------------------------------------- #
      - name: pip-audit (dependency CVEs)
        # Audits the exact locked PRODUCTION dependency set (--only main), not
        # the dev tooling, so a finding here is something that actually ships.
        #
        # Poetry 2.x moved `export` into a plugin, hence the explicit self add.
        #
        # This gate BLOCKS. Accepted CVEs are listed one-per-line with a reason
        # in .github/security/pip-audit-ignores.txt - an explicit, reviewable
        # file rather than `continue-on-error: true`.
        run: |
          poetry self add poetry-plugin-export
          poetry export --without-hashes --only main -f requirements.txt -o requirements-prod.txt
          pipx install pip-audit
          IGNORES=""
          while read -r line; do
            id="${line%%#*}"; id="$(echo "$id" | tr -d '[:space:]')"
            [ -n "$id" ] && IGNORES="$IGNORES --ignore-vuln $id"
          done < .github/security/pip-audit-ignores.txt
          echo "Suppressed advisories: ${IGNORES:-none}"
          # shellcheck disable=SC2086
          pip-audit -r requirements-prod.txt --progress-spinner=off $IGNORES

      # --- 5. Publish to the Security tab (BEST EFFORT) --------------------- #
      - name: Publish Semgrep findings
        id: sarif_semgrep
        # continue-on-error, but NOT as a way to hide a scanner failure - the
        # scanners above have already run and already failed the job on findings
        # via their exit codes. This only tolerates the UPLOAD being impossible,
        # which on a private repo without GitHub Advanced Security it is.
        # The next step makes that visible rather than silent.
        if: always() && hashFiles('semgrep.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          sarif_file: semgrep.sarif
          category: semgrep

      - name: Report code-scanning availability
        if: always()
        env:
          OUTCOME: ${{ steps.sarif_semgrep.outcome }}
        run: |
          if [ "${OUTCOME}" = "failure" ]; then
            echo "::warning title=Code scanning upload unavailable::Semgrep findings were NOT uploaded to the Security tab. This repository is private and GitHub Advanced Security is not enabled. Findings are still ENFORCED - the Semgrep step above fails the build on any ERROR-severity finding. See docs/deployment/GITHUB_ACTIONS_SETUP.md."
            {
              echo "### Code scanning upload unavailable"
              echo ""
              echo "Semgrep SARIF was **not** uploaded to the Security tab: this repo is private and"
              echo "GitHub Advanced Security is not enabled."
              echo ""
              echo "**Findings are still enforced by exit code** - this is a lost *view*, not a lost *gate*."
              echo ""
              echo "To get the Security tab: make the repo public (free) or buy GHAS."
              echo "See \`docs/deployment/GITHUB_ACTIONS_SETUP.md\`."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Code scanning upload OK."
          fi

  # ------------------------------------------------------------------------- #
  quality:
    name: Quality (pylint, complexity, Dockerfile)
    # PR-only, and never while the PR is a draft. See the cost note on top.
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-python-poetry
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          poetry-version: ${{ env.POETRY_VERSION }}

      - name: pylint
        # BLOCKS. `pylint` was already a declared dev dependency that CI never
        # ran - decoration rather than a gate. It is wired up here with a scoped
        # configuration in pyproject.toml ([tool.pylint]) that disables only what
        # ruff/black/mypy already own plus known SQLAlchemy false positives; every
        # disable carries a written reason there.
        #
        # Threshold measured, not invented: the current tree scores 9.94/10 under
        # that configuration (down from 527 raw messages to 15 real ones). 9.5
        # leaves room for a genuinely imperfect change to land without a red
        # build, while still failing on a real slide in quality.
        run: poetry run pylint app --fail-under=9.5

      - name: Complexity & maintainability report (radon)
        # REPORT-ONLY - radon prints, it does not gate. The complexity GATE is
        # ruff's C901 in the `lint` job (max-complexity = 12, measured against a
        # current worst of 11), so there is exactly one enforcer and no chance of
        # two tools disagreeing about the same number.
        #
        # This exists so the trend is visible in the job log: current baseline is
        # average complexity A (2.30) across 301 blocks, with every module's
        # maintainability index rated A.
        run: |
          echo "::group::Cyclomatic complexity (blocks rated B or worse)"
          poetry run radon cc app -n B -s --total-average
          echo "::endgroup::"
          echo "::group::Maintainability index (modules rated below A)"
          poetry run radon mi app -n B
          echo "(no rows above means every module is rated A)"
          echo "::endgroup::"

      - name: hadolint (Dockerfile)
        # BLOCKS, at the strictest threshold (`info`, set in .hadolint.yaml).
        # Verified clean on the current Dockerfile. Exactly one rule is ignored
        # there - DL3008, apt version pinning - with a written justification;
        # DL3066 was FIXED rather than ignored (USER is now numeric 1000:1000).
        # PINNED TO v3.5.0 DELIBERATELY: that release ships hadolint v2.15.1,
        # the exact version verified locally. v3.1.0 shipped hadolint v2.12.0,
        # which does not resolve the `ARG PYTHON_IMAGE` default in `FROM
        # ${PYTHON_IMAGE}` and therefore reported DL3006 ("always tag the version
        # of an image explicitly") against a base image that IS pinned - by
        # digest. Local passed, CI failed, on the same file and the same config.
        #
        # Fixed by matching versions rather than by adding DL3006 to
        # .hadolint.yaml: suppressing it would mask a genuinely untagged FROM
        # added later. A gate that disagrees between local and CI is worse than
        # no gate, so the versions must track.
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile
          config: .hadolint.yaml
          failure-threshold: info

  # ------------------------------------------------------------------------- #

  # ------------------------------------------------------------------------- #
  dependency-review:
    name: Dependency review (PR only)
    # Two conditions, both required:
    #
    #  1. pull_request only - it diffs the dependency manifest between base and
    #     head, and there is no "before" on a push to `develop`.
    #
    #  2. The repository must actually support it. dependency-review needs the
    #     Dependency Graph, which on a PRIVATE repo requires GitHub Advanced
    #     Security. Without it the action fails with "Dependency review is not
    #     supported on this repository" - which is what happened on the first
    #     real run. A permanently-red job trains people to ignore red, so this
    #     SKIPS instead.
    #
    # It re-enables automatically if the repo is made public (code scanning and
    # the dependency graph are free there), or immediately by setting the
    # repository variable ENABLE_CODE_SCANNING=true once GHAS is purchased.
    # See docs/deployment/GITHUB_ACTIONS_SETUP.md.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      (github.event.repository.private == false || vars.ENABLE_CODE_SCANNING == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Review dependency changes
        # Catches a vulnerable or badly-licensed dependency at the moment it is
        # INTRODUCED. pip-audit already scans the whole tree, but on a PR that is
        # too late to be cheap: it tells you the trunk is vulnerable after the merge.
        # This blocks the PR that would cause it.
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
          # Copyleft licences would oblige this project to publish its source.
          # Flagged for a human decision, not silently accepted.
          deny-licenses: GPL-3.0, AGPL-3.0, LGPL-3.0

  # ------------------------------------------------------------------------- #

  # ------------------------------------------------------------------------- #
  build:
    name: Build image & scan
    # PR-only, and never while the PR is a draft. See the cost note on top.
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    # The image is only built once everything that can invalidate it is green.
    # Trivy runs after the build because it scans the resolved image filesystem;
    # Semgrep (in `security`) scans source patterns. They are complementary, not
    # redundant - neither finds what the other finds.
    needs: [lint, quality, test, migrations, e2e, security]
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          # Built and loaded locally, never pushed. CI proves the image builds
          # and is scannable; publishing is cd-staging.yml's job - and it is the
          # ONLY workflow that publishes, which is what lets cd-production.yml
          # refuse to deploy anything staging did not first prove.
          push: false
          load: true
          tags: cofoundaz-api:ci
          build-args: |
            GIT_SHA=${{ github.sha }}
            VERSION=ci-${{ github.run_number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the built image
        # A green `docker build` only proves the layers assembled. This proves the
        # interpreter, the venv, and the app package actually work together -
        # catching, for example, a dependency dropped from the runtime stage.
        run: |
          docker run --rm \
            -e SECRET_KEY=ci -e DATABASE_URL=postgresql://u:p@h:5432/d \
            -e FIRST_SUPERUSER_EMAIL=a@b.com -e FIRST_SUPERUSER_PASSWORD=x \
            -e LOG_FILE_PATH= \
            cofoundaz-api:ci python -c "import app.main; print('app imports OK')"
          docker run --rm cofoundaz-api:ci alembic --help > /dev/null
          echo "alembic CLI present in image OK"

      - name: Run the image the way production runs it
        # BLOCKS. Closes the largest hole in this pipeline: until this step,
        # NOTHING in the repository had ever started the image's own CMD.
        #
        #   - the smoke test above overrides it (`python -c ...`, `alembic --help`)
        #   - scripts/e2e_run.sh boots bare `uvicorn` on the host: one process,
        #     no arbiter, no prefork, no signal forwarding through tini
        #   - docker-compose.yml (dev) overrides it with reloading uvicorn
        #
        # So gunicorn, the uvicorn worker class, WEB_CONCURRENCY,
        # --graceful-timeout and the rest of the CMD shipped to production
        # completely unexercised - a gunicorn major bump or a worker class
        # deprecated out from under us would have been discovered on the VPS.
        #
        # The script asserts the container reaches Docker's HEALTHY state on the
        # image's own HEALTHCHECK timings, that WEB_CONCURRENCY actually
        # determines the worker count (it overrides the baked default so a
        # hardcoded --workers could not pass), that /health and
        # /api/v1/health/ready both answer 200 with database AND redis ok, that
        # no worker churns while serving, and - the one this exists for - that
        # SIGTERM drains to EXIT CODE 0 rather than 137. A 137 is SIGKILL, which
        # means every deploy severs in-flight requests.
        #
        # Verified to actually bite before being trusted here: against an image
        # whose CMD hardcodes --workers it fails on the worker count, and
        # against an image whose PID 1 swallows SIGTERM it fails on exit 137 -
        # and that second image passed every other assertion in this file,
        # including the healthcheck and both endpoints.
        #
        # Same script `make image-check` runs locally, deliberately: what CI
        # proves is what a developer can reproduce. ~15s including dependencies.
        run: ./scripts/image_cmd_check.sh cofoundaz-api:ci

      - name: Generate SBOM (CycloneDX)
        # A Software Bill of Materials for the image that was just built. Its
        # value is retrospective: when the next critical CVE lands, "are we
        # affected, and which build first shipped it?" is answerable from stored
        # SBOMs in seconds instead of by rebuilding old commits.
        #
        # Generated from the IMAGE, not from poetry.lock, so it records what
        # actually ships - OS packages included. Verified locally: CycloneDX 1.7,
        # 174 components (173 libraries + 1 operating-system entry), ~300 KB.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: cofoundaz-api:ci
          format: cyclonedx
          output: sbom.cdx.json
          # An SBOM is an inventory, not a scan: no severity filter and no
          # exit-code, so it can never fail the build.

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-cyclonedx-${{ github.sha }}
          path: sbom.cdx.json
          # Longer than the 7-day coverage retention: the point of an SBOM is to
          # answer questions about builds you shipped a while ago.
          retention-days: 90

      - name: Trivy (image CVEs)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: cofoundaz-api:ci
          format: sarif
          output: trivy.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore

      - name: Publish Trivy findings
        id: sarif_image
        # Best-effort and guarded, same reasoning as the other jobs: the gate is
        # the separate "Fail on HIGH/CRITICAL" step below, which runs regardless.
        if: always() && hashFiles('trivy.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          sarif_file: trivy.sarif
          # Distinct from trivy-fs / trivy-config in the trivy-repo job, so the
          # three scan modes stay as three separate result sets in the Security
          # tab rather than overwriting one another.
          category: trivy-image

      - name: Fail on HIGH/CRITICAL
        # `if: always()` so a best-effort upload failure above can never skip the
        # gate. Losing the Security tab must not mean losing the veto.
        if: always()
        # Deliberately a SEPARATE step from the SARIF-producing scan above, so
        # findings always reach the Security tab even when the gate fails. A
        # single scan step with exit-code:1 would abort before the upload and
        # hide the very detail needed to triage.
        #
        # ignore-unfixed: a CVE with no released fix cannot be actioned by
        # upgrading; blocking every deploy on it just teaches people to bypass
        # the gate. Those are tracked via the Security tab instead.
        # Documented exceptions live in .trivyignore.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: cofoundaz-api:ci
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore
