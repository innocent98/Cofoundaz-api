# Host-wide hardening, buffer sizing, logging and compression.
#   -> /etc/nginx/conf.d/10-hardening.conf

# Removes the nginx version from the `Server:` header and from error pages.
# Defence in depth only - it does not make an unpatched nginx safe - but it
# stops the trivial "which nginx builds have known CVEs" pass over the whole
# internet from flagging this host for free.
server_tokens off;

# ---------------------------------------------------------------------------
# Request size and shape
# ---------------------------------------------------------------------------
# GLOBAL DEFAULT. This API is JSON; a 1 MB request body is already generous for
# every endpoint except the logo upload, which raises it in its own location
# block. Setting the global limit to the largest value any endpoint needs is the
# common mistake - it hands every other endpoint a DoS budget it has no use for.
client_max_body_size 1m;

client_body_buffer_size 128k;
client_header_buffer_size 4k;
large_client_header_buffers 4 16k;

# Slowloris budget: how long a client may take to send headers/body. Short,
# because a legitimate client on a bad connection retries and an attacker's
# whole technique is to hold sockets open doing nothing.
client_body_timeout 15s;
client_header_timeout 15s;
send_timeout 30s;

# Keep-alive to the CLIENT. 65s comfortably outlasts the typical 60s browser
# idle and saves a handshake per page.
keepalive_timeout 65s;
keepalive_requests 1000;

# Refuse HTTP methods this API never implements, before they reach the app.
# Cheap, and it removes TRACE (cross-site tracing) from the surface entirely.
map $request_method $cfz_bad_method {
    default          0;
    ~^(TRACE|TRACK)$ 1;
}

# ---------------------------------------------------------------------------
# Per-host header values, resolved by a map so the header snippets stay shared
# ---------------------------------------------------------------------------
# snippets/cofoundaz/security-headers-base.conf is included in several places
# (server level, and again inside any location that sets its own CSP, because a
# single `add_header` in a location DROPS every inherited one). Anything that
# differs between production and staging therefore cannot be written literally
# in that snippet - it is resolved from $host here instead.

# HSTS.
#
# `includeSubDomains` on the production host is safe and close to a no-op:
# nothing is served under *.api.cofoundaz.com. It is set anyway so that if
# something ever is, it inherits HTTPS-only by default rather than by memory.
#
# `preload` IS DELIBERATELY ABSENT FROM BOTH. It is the one irreversible
# directive in this whole configuration. Submitting to the browser preload list
# is not a header you can take back: removal takes months to reach shipped
# browsers, and until then every browser refuses plain HTTP for that name no
# matter what the server sends. A two-year max-age is a two-year commitment made
# by one `add_header` line.
#
# It is also not this host's decision to make. hstspreload.org requires the
# APEX (cofoundaz.com) to serve `includeSubDomains; preload` and redirect to
# HTTPS, and an apex preloaded with includeSubDomains locks the ENTIRE zone -
# including future subdomains this API will never hear about: a vendor CNAME
# that only speaks HTTP, a status page, a mail host. That is a whole-zone call
# for whoever owns cofoundaz.com, taken once the zone is known to be all-HTTPS
# permanently. Enabling it here would make it for them.
#
# Staging gets a plain one-year max-age with no includeSubDomains: shorter,
# narrower, and survivable if staging ever has to be moved or rebuilt.
map $host $cfz_hsts {
    default                     "max-age=31536000";
    api.cofoundaz.com           "max-age=63072000; includeSubDomains";
    staging-api.cofoundaz.com   "max-age=31536000";
}

# X-Robots-Tag. Empty on production - nginx omits an add_header whose value
# evaluates to the empty string, so no header is emitted there at all.
#
# A public staging API is a copy of production with a different hostname. Left
# alone, crawlers index its error pages, its OpenAPI schema and its docs UI, and
# staging URLs start turning up in results for the product's own name. This
# costs nothing and prevents that.
#
# It is a REQUEST, not a control: it stops well-behaved crawlers and nothing
# else. It is the floor of the staging posture in docs/deployment/NGINX_TLS.md,
# not the whole of it.
map $host $cfz_robots {
    default                     "";
    staging-api.cofoundaz.com   "noindex, nofollow, noarchive";
}

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
# A log format built for the two questions actually asked at 3am: "who was it"
# and "was the API slow or was nginx slow".
#
#   $remote_addr        the real client (nginx is the trust boundary; see the
#                       X-Forwarded-For note in snippets/proxy-backend.conf)
#   $request_time       total, edge to client
#   $upstream_response_time  time the FastAPI app took
#   $upstream_status    what the app returned, which differs from $status
#                       whenever an error_page rewrote it
#   $request_id         nginx-generated, also forwarded upstream as X-Request-ID
log_format cofoundaz '$remote_addr - $remote_user [$time_local] '
                     '"$request" $status $body_bytes_sent '
                     '"$http_referer" "$http_user_agent" '
                     'rt=$request_time urt=$upstream_response_time '
                     'us=$upstream_status rid=$request_id';

# ---------------------------------------------------------------------------
# Compression
# ---------------------------------------------------------------------------
gzip on;
gzip_vary on;

# `any` compresses proxied responses regardless of the upstream's Cache-Control.
# Everything behind this edge is our own API, so there is no third-party
# response whose caching semantics we would be second-guessing.
gzip_proxied any;

# 5, not the maximal 9. Above ~5 the CPU cost climbs steeply for single-digit
# percentage gains on JSON.
gzip_comp_level 5;

# Below ~1 KB, framing overhead means compression can make the response BIGGER,
# and it always makes it slower.
gzip_min_length 1024;

gzip_types
    application/json
    application/problem+json
    application/javascript
    application/xml
    text/css
    text/javascript
    text/plain
    text/xml;

# ---------------------------------------------------------------------------
# Brotli - OPT IN, and it will not parse without the module
# ---------------------------------------------------------------------------
# Brotli is NOT part of stock nginx and is NOT compiled into Debian's or
# Ubuntu's nginx package. Uncommenting these on a host without the module is a
# hard `nginx -t` failure ("unknown directive"), which is why they ship
# commented rather than "helpfully" enabled.
#
# To enable, from the nginx.org repository (see docs/deployment/NGINX_TLS.md):
#
#   apt-get install nginx-module-brotli
#   # then, at the TOP of /etc/nginx/nginx.conf, before any http{} block:
#   load_module modules/ngx_http_brotli_filter_module.so;
#   load_module modules/ngx_http_brotli_static_module.so;
#
# then uncomment:
#
# brotli on;
# brotli_comp_level 5;
# brotli_min_length 1024;
# brotli_types application/json application/javascript text/css text/plain text/xml;
#
# Worth it? For JSON, brotli beats gzip by roughly 15-20% at comparable CPU.
# On an API whose responses are mostly small, that is real but not dramatic -
# treat it as a nice-to-have, not a prerequisite.
#
# NOT VERIFIED: no host with the brotli module was available, so these
# directives have never been parsed by an nginx that could accept them.
