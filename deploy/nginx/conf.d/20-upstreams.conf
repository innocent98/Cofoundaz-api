# The two compose stacks on this host.
#   -> /etc/nginx/conf.d/20-upstreams.conf
#
# Both API containers publish on 127.0.0.1 ONLY (docker-compose.prod.yml:
# `127.0.0.1:${API_PORT}:8000`). nginx is the sole path from the internet to
# either of them. The published port is the ONLY thing distinguishing the two
# stacks at this layer, so these entries and each stack's `.env` API_PORT must
# agree:
#
#   api.cofoundaz.com          -> 127.0.0.1:8000   (project cofoundaz-api-prod)
#   staging-api.cofoundaz.com  -> 127.0.0.1:8001   (project cofoundaz-api-staging)

upstream cofoundaz_production {
    server 127.0.0.1:8000 max_fails=3 fail_timeout=10s;

    # Connection pooling to gunicorn. Without this every proxied request pays a
    # fresh TCP handshake to loopback - small per request, but it also churns
    # through ephemeral ports under load.
    keepalive 32;

    # MUST be LESS than gunicorn's `--keep-alive 5` (see the CMD in Dockerfile).
    # This is the classic source of intermittent, unreproducible 502s behind
    # nginx: if nginx believes a pooled connection is good for longer than
    # gunicorn is willing to hold it, gunicorn closes first and nginx writes a
    # request into a socket that is already gone. 4s < 5s means nginx always
    # discards first, so the race cannot happen in that direction.
    keepalive_timeout 4s;

    # Bounded by gunicorn's `--max-requests 1000` worker recycling.
    keepalive_requests 1000;
}

upstream cofoundaz_staging {
    server 127.0.0.1:8001 max_fails=3 fail_timeout=10s;
    keepalive 32;
    keepalive_timeout 4s;
    keepalive_requests 1000;
}
