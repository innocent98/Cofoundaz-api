# Edge rate limiting.
#   -> /etc/nginx/conf.d/30-rate-limits.conf
#
# ---------------------------------------------------------------------------
# WHAT THIS LAYER IS FOR, AND WHAT IT IS NOT FOR
# ---------------------------------------------------------------------------
# The application already rate-limits. `app/main.py` builds a slowapi Limiter
# with `default_limits=["${RATE_LIMIT_PER_MINUTE}/minute"]` (120/minute) keyed by
# `_rate_limit_key`: the authenticated user's `sub` claim when a valid Bearer
# token is present, otherwise the client address.
#
# So the app enforces FAIRNESS BETWEEN USERS. nginx must not try to do that job
# again - it cannot see the JWT subject, so anything it counts per IP would put
# every user behind one office NAT or one mobile carrier CGNAT into a single
# bucket. Two limiters both trying to be the per-user limiter is how you get
# 429s that no amount of "but I only made three requests" can explain.
#
# nginx's job is the one the app cannot do: ABSORB ABUSE BEFORE IT COSTS
# ANYTHING. A flood that nginx rejects never gets a gunicorn worker, a database
# connection, or a JWT verification. The limits below are therefore set an order
# of magnitude ABOVE any plausible legitimate per-user rate, so that in normal
# operation the app's limiter is always the one that fires first and nginx's is
# invisible.
#
#   layer   keyed on            budget                 fires when
#   -----   ------------------  ---------------------  -------------------------
#   app     user (or IP)        120/min  = 2 r/s       one user is too chatty
#   nginx   IP                  30 r/s, burst 60       one address is attacking
#
# The 15x gap is the design. Narrow it and nginx starts pre-empting the app's
# limiter for shared-IP users, which is precisely the failure mode being avoided.
#
# ---------------------------------------------------------------------------
# WHY PER-ENVIRONMENT ZONES
# ---------------------------------------------------------------------------
# Separate zones per vhost, so a burst against staging cannot spend production's
# budget for the same address. That is not hypothetical here: the CD gate runs
# the E2E suite against staging from a GitHub-hosted runner, and those runners
# share address space with a great deal of other traffic.
#
# 5m per zone holds ~80,000 distinct addresses (~64 bytes of state each). Six
# zones is ~30 MB of the ~2.5 GB the compose sizing leaves free on this host.

limit_req_zone $binary_remote_addr zone=cfz_prod_general:5m rate=30r/s;
limit_req_zone $binary_remote_addr zone=cfz_prod_auth:5m    rate=5r/s;

# Staging's auth zone is DELIBERATELY looser than production's. The E2E gate is
# a single runner address driving login, signup and refresh in a tight loop; at
# production's 5r/s it would be one slow CI runner away from failing the gate on
# a 429 that has nothing to do with the change under test. Staging is not where
# credential stuffing is defended against - production is.
limit_req_zone $binary_remote_addr zone=cfz_stg_general:5m rate=30r/s;
limit_req_zone $binary_remote_addr zone=cfz_stg_auth:5m    rate=15r/s;

# Concurrent connections per address. SHARED between the two vhosts on purpose:
# sockets are a host-wide resource, unlike request budget. 40 is far above what
# a browser (6 per origin) or an HTTP/2 client (1) needs, and far below what a
# slowloris needs to matter.
limit_conn_zone $binary_remote_addr zone=cfz_conn:5m;

# Return the same status the application returns for its own limit, so a client
# has one code to handle regardless of which layer rejected it. The response
# BODY also matches the app's error envelope - see snippets/json-errors.conf.
limit_req_status 429;
limit_conn_status 429;

# `warn`, not the default `error`: a tripped edge limit is an event worth seeing
# in context, not an nginx malfunction.
limit_req_log_level warn;
limit_conn_log_level warn;
