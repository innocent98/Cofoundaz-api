# TLS defaults, applied to every server block on this host.
#   -> /etc/nginx/conf.d/00-tls.conf
#
# These live at http{} level rather than being repeated per vhost. Two vhosts
# that each carry their own copy of the TLS posture WILL drift, and the one that
# drifts is the one nobody tests. The only TLS thing a vhost declares is which
# certificate it uses.
#
# Posture: Mozilla "Intermediate", minus the DHE ciphersuites (see below).

# TLS 1.2 floor. No SSLv3, no TLS 1.0, no TLS 1.1 - POODLE and BEAST are not
# theoretical and every client that matters has spoken TLS 1.2 since 2015.
#
# TLS 1.3 ONLY is tempting and is NOT what is configured here: it drops roughly
# the last few percent of clients (older Android WebViews, some corporate TLS
# middleboxes, older Python/Java HTTP stacks). A public API cannot choose its
# clients, so 1.2 stays until there is evidence nothing needs it.
ssl_protocols TLSv1.2 TLSv1.3;

# TLS 1.2 ciphersuites. ECDHE only - every one of these gives forward secrecy.
#
# The Mozilla Intermediate list also contains three DHE-RSA suites. They are
# deliberately omitted: DHE requires an `ssl_dhparam` file, nginx refuses to
# offer DHE without one, and generating/shipping/rotating a 4096-bit parameter
# file buys nothing here - no client in this decade needs DHE when ECDHE is on
# offer, and DHE is slower. Fewer moving parts, identical client coverage.
#
# TLS 1.3 ciphersuites are NOT configurable through this directive; nginx uses
# OpenSSL's TLS 1.3 defaults (AES-GCM + CHACHA20), which are all acceptable.
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;

# `off` lets the CLIENT pick from the list above. That is the modern advice and
# it is not a weakening: every suite offered is strong, so the client is better
# placed to choose - a phone without AES hardware picks CHACHA20 and gets both
# better security margin and better battery life than server-forced AES.
ssl_prefer_server_ciphers off;

# Session resumption cuts a full handshake to an abbreviated one on repeat
# visits. 10m of shared cache is roughly 40,000 sessions.
ssl_session_cache shared:cofoundaz_ssl:10m;
ssl_session_timeout 1d;

# Tickets OFF. A session ticket key that is never rotated lets anyone who later
# obtains it decrypt recorded traffic - i.e. it silently defeats the forward
# secrecy the ECDHE suites above exist to provide. nginx has no key rotation of
# its own. The server-side session cache above gives resumption without that
# trade.
ssl_session_tickets off;

# OCSP stapling.
#
# STATE THIS PLAINLY: with a Let's Encrypt certificate these two directives
# currently do NOTHING. Let's Encrypt retired its OCSP responders and stopped
# including an OCSP URL in issued certificates, so nginx has nothing to staple
# and logs `ssl_stapling ignored, no OCSP responder URL in the certificate`.
# That warning is expected and is not a misconfiguration.
#
# They stay because they are free, correct, and become live the moment the
# certificate comes from an issuer that still publishes OCSP. Deleting them
# would be a config change waiting to be forgotten.
#
# NOT VERIFIED: no certificate exists yet, so neither the stapling behaviour nor
# the absence of the warning has been observed on a real host.
ssl_stapling on;
ssl_stapling_verify on;

# Used by stapling (and nothing else here - no proxy_pass in this repo's vhosts
# uses a variable hostname, so no runtime DNS is required for proxying).
# On Ubuntu with systemd-resolved, `127.0.0.53` is the better choice; public
# resolvers are the portable default.
resolver 1.1.1.1 8.8.8.8 valid=300s;
resolver_timeout 5s;
