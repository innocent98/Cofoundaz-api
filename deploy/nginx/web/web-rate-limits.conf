# Rate-limit zones for the web frontend vhosts.
#   -> /etc/nginx/conf.d/31-web-rate-limits.conf
#
# Separate from the API zones (conf.d/30-rate-limits.conf) so a page load, which
# fans out into dozens of /_next/static requests, never spends a visitor's API
# budget. Generous on purpose: this is a flood backstop, not abuse control.
limit_req_zone $binary_remote_addr zone=cfz_web_production:5m rate=50r/s;
limit_req_zone $binary_remote_addr zone=cfz_web_staging:5m    rate=50r/s;
