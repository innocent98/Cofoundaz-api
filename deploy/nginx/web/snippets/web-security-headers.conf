# Security headers for the HTML web app (NOT the API).
#   -> /etc/nginx/snippets/cofoundaz/web-security-headers.conf
#
# Deliberately NOT snippets/cofoundaz/security-headers-base.conf, which is tuned
# for a JSON API and would break the app:
#   - COOP same-origin cuts the opener link that the Google sign-in, Paystack
#     and Mono Connect popups rely on;
#   - Referrer-Policy no-referrer strips the origin some payment providers check.
# No Content-Security-Policy yet: Next injects inline scripts, so a useful CSP
# needs nonces wired in the app first (follow-up in the runbook).
#
# Include at SERVER level only. A location with its own add_header loses all of
# these (nginx add_header inheritance).
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "accelerometer=(), gyroscope=(), magnetometer=(), usb=(), geolocation=(), microphone=(), camera=(self)" always;
add_header Strict-Transport-Security $cfz_hsts always;
