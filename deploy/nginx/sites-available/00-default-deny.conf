# Catch-all: anything that is not one of the two known hostnames.
#   -> /etc/nginx/sites-available/00-default-deny.conf
#      symlinked into /etc/nginx/sites-enabled/
#
# WHY THIS EXISTS. Without an explicit `default_server`, nginx makes the FIRST
# server block it parses the default for that address:port - so whichever vhost
# happens to sort first would answer for every unmatched Host header, including
# `https://<vps-ip>/` and every scanner probing the address with a junk Host.
# Two bad outcomes follow: production quietly serves traffic addressed to
# nothing in particular, and a browser hitting the raw IP gets a certificate
# name mismatch that looks like a misconfiguration of the real site.
#
# Enable it FIRST (the 00- prefix is what guarantees it is parsed first, and
# `default_server` is what actually makes it the default - both, because the
# ordering also documents the intent).

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # 444 is nginx's non-standard "close the connection without a response".
    # A scanner learns nothing: no status, no headers, no server banner.
    # It costs one accept() and nothing else.
    return 444;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    # No certificate is declared, and none is needed. `ssl_reject_handshake`
    # (nginx 1.19.4+) aborts the TLS handshake with `unrecognized_name` as soon
    # as SNI fails to match a real vhost.
    #
    # The alternative - pointing this block at one of the real certificates -
    # is worse in a way that is easy to miss: it would present the production
    # certificate to anyone connecting to the bare IP, confirming which host
    # lives here, and it would make a certificate renewal failure on that one
    # vhost break the catch-all too.
    ssl_reject_handshake on;
}
