# STAGING vhost - staging-api.cofoundaz.com -> 127.0.0.1:8001
#   -> /etc/nginx/sites-available/staging-api.cofoundaz.com.conf
#      symlinked into /etc/nginx/sites-enabled/
#
# THIS HOST IS PUBLICLY REACHABLE, AND THAT IS DELIBERATE. The CD pipeline gates
# production on a live E2E run against deployed staging (.github/workflows/cd.yml,
# job `staging-e2e`), executed from a GitHub-hosted runner. Those runners have no
# stable egress addresses, so an IP allowlist would break the gate. The posture,
# the reasoning, and the optional HTTP Basic layer are in
# docs/deployment/NGINX_TLS.md.
#
# It differs from production in exactly five ways, all of them on purpose:
#   1. upstream port 8001, not 8000
#   2. X-Robots-Tag: noindex (via the $cfz_robots map)
#   3. a shorter HSTS max-age, no includeSubDomains (via the $cfz_hsts map)
#   4. a looser auth rate limit, so the E2E gate cannot 429 itself
#   5. the OpenAPI docs are SERVED here rather than 404'd
#
# NOT VERIFIED: never served on a real host. See the header of
# api.cofoundaz.com.conf.

# --------------------------------------------------------------------------- #
# :80
# --------------------------------------------------------------------------- #
server {
    listen 80;
    listen [::]:80;
    server_name staging-api.cofoundaz.com;

    include snippets/cofoundaz/acme-challenge.conf;

    location / {
        return 301 https://$host$request_uri;
    }
}

# --------------------------------------------------------------------------- #
# :443
# --------------------------------------------------------------------------- #
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    # If QUIC is ever enabled on both vhosts, `reuseport` goes on ONE of them
    # only - see api.cofoundaz.com.conf.

    server_name staging-api.cofoundaz.com;

    # A SEPARATE certificate, not a shared one. api.cofoundaz.com and
    # staging-api.cofoundaz.com are sibling subdomains, so a single certificate
    # would have to be a SAN cert covering both (or a wildcard, which needs
    # DNS-01 and an API token for the DNS provider). Per-host HTTP-01 issue is
    # simpler, has nothing to configure, and means a renewal failure on one host
    # cannot take the other offline.
    ssl_certificate     /etc/letsencrypt/live/staging-api.cofoundaz.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging-api.cofoundaz.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/staging-api.cofoundaz.com/chain.pem;

    access_log /var/log/nginx/cofoundaz-staging.access.log cofoundaz;
    error_log  /var/log/nginx/cofoundaz-staging.error.log warn;

    include snippets/cofoundaz/security-headers-base.conf;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;

    include snippets/cofoundaz/json-errors.conf;

    limit_conn cfz_conn 40;

    if ($cfz_bad_method) {
        return 405;
    }

    # ----------------------------------------------------------------------- #
    # OPTIONAL: HTTP Basic in front of staging.
    # ----------------------------------------------------------------------- #
    # Left OFF by default. Turning it on is a real decision with a real cost -
    # see "Staging exposure" in docs/deployment/NGINX_TLS.md, which also spells
    # out how CD passes the credentials without a single change to the e2e/
    # suite (userinfo in the E2E_BASE_URL secret; httpx sends Basic
    # automatically) and which paths must stay open regardless.
    #
    # If enabled, it goes HERE at server level so it covers everything, and the
    # ACME and health locations below opt back OUT with `auth_basic off;`.
    # Enabling it without those exemptions breaks certificate renewal and every
    # uptime probe, and both failures are silent until they are not.
    #
    # auth_basic           "cofoundaz staging";
    # auth_basic_user_file /etc/nginx/cofoundaz-staging.htpasswd;

    # ----------------------------------------------------------------------- #
    # Logo upload
    # ----------------------------------------------------------------------- #
    location = /api/v1/onboarding/logo {
        client_max_body_size 3m;
        client_body_timeout 60s;
        limit_req zone=cfz_stg_general burst=60 nodelay;

        include snippets/cofoundaz/proxy-backend.conf;
        proxy_pass http://cofoundaz_staging;
    }

    # ----------------------------------------------------------------------- #
    # Auth endpoints - looser than production, on purpose
    # ----------------------------------------------------------------------- #
    location ^~ /api/v1/auth/ {
        # 15r/s burst 30 against production's 5r/s burst 10. The E2E gate drives
        # signup, login and refresh in a tight serial loop from ONE runner
        # address; production's budget would put the gate one slow runner away
        # from failing on a 429 unrelated to the change under test. A false red
        # on the gate that blocks production teaches people to re-run it, which
        # is how a gate stops being a gate.
        #
        # Credential stuffing is defended at production. Staging holds test data
        # and is rebuilt from the same image on every deploy.
        limit_req zone=cfz_stg_auth burst=30 nodelay;

        include snippets/cofoundaz/proxy-backend.conf;
        proxy_pass http://cofoundaz_staging;
    }

    # ----------------------------------------------------------------------- #
    # Health probes
    # ----------------------------------------------------------------------- #
    location ^~ /api/v1/health {
        access_log off;
        # auth_basic off;   # uncomment together with the server-level auth_basic
        limit_req zone=cfz_stg_general burst=60 nodelay;

        include snippets/cofoundaz/proxy-backend.conf;
        proxy_pass http://cofoundaz_staging;
    }

    # ----------------------------------------------------------------------- #
    # OpenAPI docs - OPEN here, and this is the reason production can close them
    # ----------------------------------------------------------------------- #
    # /api/v1/openapi.json is not optional: e2e/test_smoke.py::test_openapi_served
    # fetches it, and that test is part of the 13 that gate production. Blocking
    # it here would break the deploy pipeline, not just a convenience.
    #
    # The Swagger UI and ReDoc pages are HTML that load their bundles from
    # jsDelivr, so the strict `default-src 'none'` CSP above renders both blank -
    # with no error the user can see, just an empty page. This location therefore
    # re-declares the FULL header set (a location with any add_header inherits
    # none) with a CSP wide enough for those two pages and nothing else.
    #
    # Every source below was read out of the pinned fastapi 0.136.3
    # (fastapi/openapi/docs.py), not assumed:
    #   swagger  js/css  https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/...
    #   redoc    js      https://cdn.jsdelivr.net/npm/redoc@2/bundles/...
    #   favicon          https://fastapi.tiangolo.com/img/favicon.png
    #   redoc    fonts   https://fonts.googleapis.com + https://fonts.gstatic.com
    #
    # 'unsafe-inline' on script-src is required and is not an oversight: FastAPI
    # emits an inline <script> that calls SwaggerUIBundle({...}). It is tolerable
    # ONLY because the page is a static shell that renders a schema. It is also a
    # concrete reason not to reproduce this location on production.
    location ~ ^/api/v1/(docs|redoc|openapi\.json)$ {
        include snippets/cofoundaz/security-headers-base.conf;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self' https://cdn.jsdelivr.net 'unsafe-inline'; style-src 'self' https://cdn.jsdelivr.net https://fonts.googleapis.com 'unsafe-inline'; font-src https://fonts.gstatic.com data:; img-src 'self' https://fastapi.tiangolo.com data: blob:; connect-src 'self'; worker-src blob:; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;

        limit_req zone=cfz_stg_general burst=60 nodelay;

        include snippets/cofoundaz/proxy-backend.conf;
        proxy_pass http://cofoundaz_staging;
    }

    # ----------------------------------------------------------------------- #
    # Everything else
    # ----------------------------------------------------------------------- #
    location / {
        limit_req zone=cfz_stg_general burst=60 nodelay;

        include snippets/cofoundaz/proxy-backend.conf;
        proxy_pass http://cofoundaz_staging;
    }
}
