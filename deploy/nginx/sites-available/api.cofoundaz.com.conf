# PRODUCTION vhost - api.cofoundaz.com -> 127.0.0.1:8000
#   -> /etc/nginx/sites-available/api.cofoundaz.com.conf
#      symlinked into /etc/nginx/sites-enabled/
#
# Full first-time setup, DNS records and certificate issue:
#   docs/deployment/NGINX_TLS.md
#
# NOT VERIFIED: no VPS and no DNS were available while this was written. It has
# been parsed by `nginx -t` and exercised end to end against a real backend with
# a self-signed certificate (see deploy/nginx/test/), but it has never served a
# Let's Encrypt certificate or a real client.

# --------------------------------------------------------------------------- #
# :80 - ACME challenge, then redirect everything else
# --------------------------------------------------------------------------- #
server {
    listen 80;
    listen [::]:80;
    server_name api.cofoundaz.com;

    # Must come before the redirect - see the snippet for why a redirected ACME
    # challenge is a renewal failure waiting for the certificate to expire.
    include snippets/cofoundaz/acme-challenge.conf;

    location / {
        # 301, not 302: this is permanent, and a permanent redirect is what
        # lets browsers and HSTS-aware clients stop making the plaintext request
        # at all. The first request over HTTP is the one that can be
        # intercepted; the goal is for there to be no second one.
        return 301 https://$host$request_uri;
    }
}

# --------------------------------------------------------------------------- #
# :443
# --------------------------------------------------------------------------- #
server {
    # `http2 on;` as a separate directive, not `listen 443 ssl http2;`.
    # The `http2` listen parameter was deprecated in nginx 1.25.1 and emits a
    # warning; this form REQUIRES 1.25.1+. Debian 12 (1.22) and Ubuntu 24.04
    # (1.24) ship older nginx and will fail `nginx -t` on it - install from
    # nginx.org rather than reverting to the deprecated form. NGINX_TLS.md has
    # the repository setup and the version check.
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    # HTTP/3 / QUIC. Commented, not enabled: it needs nginx built with QUIC
    # support AND udp/443 open in UFW, neither of which could be checked from
    # here. Enabling it against an nginx without QUIC is an `unknown directive`
    # parse failure, so it must be a deliberate step. See NGINX_TLS.md.
    #
    # listen 443 quic reuseport;
    # listen [::]:443 quic reuseport;
    # http3 on;
    # add_header Alt-Svc 'h3=":443"; ma=86400' always;
    #
    # `reuseport` may appear on only ONE server block per address:port across
    # the whole configuration. If both vhosts enable QUIC, exactly one of them
    # carries `reuseport`.

    server_name api.cofoundaz.com;

    # fullchain.pem, NEVER cert.pem. cert.pem is the leaf alone; fullchain.pem is
    # leaf + intermediates. Serving the leaf alone works in browsers (they cache
    # intermediates and can fetch by AIA) and fails in exactly the clients that
    # are hardest to debug: Android, Java, older Python, curl on minimal images.
    # It is the single most common "works in my browser, breaks in the mobile
    # app" TLS bug.
    ssl_certificate     /etc/letsencrypt/live/api.cofoundaz.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.cofoundaz.com/privkey.pem;
    # Used only by OCSP stapling, which is currently inert with Let's Encrypt -
    # see conf.d/00-tls.conf.
    ssl_trusted_certificate /etc/letsencrypt/live/api.cofoundaz.com/chain.pem;

    # Protocol versions, ciphers and session handling come from
    # conf.d/00-tls.conf and are shared with staging by design.

    access_log /var/log/nginx/cofoundaz-prod.access.log cofoundaz;
    error_log  /var/log/nginx/cofoundaz-prod.error.log warn;

    # Security headers at server level. Any location below that sets its own
    # add_header MUST include this file again - a single add_header in a
    # location discards every inherited one.
    include snippets/cofoundaz/security-headers-base.conf;

    # CSP for a JSON API. `default-src 'none'` is not decoration: it means a
    # response from this origin cannot load or execute anything at all, so a
    # reflected value that a browser is somehow persuaded to treat as HTML has
    # no route to fetching a script.
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;

    # JSON bodies for edge-generated 429/502/503/504.
    include snippets/cofoundaz/json-errors.conf;

    # Concurrent sockets per client address.
    limit_conn cfz_conn 40;

    # TRACE/TRACK never reach the app. `if` is used here only for `return`,
    # which is one of the two forms that are actually safe in a server block.
    if ($cfz_bad_method) {
        return 405;
    }

    # ----------------------------------------------------------------------- #
    # Logo upload - the one endpoint that needs a bigger body than the global
    # 1 MB default in conf.d/10-hardening.conf.
    # ----------------------------------------------------------------------- #
    location = /api/v1/onboarding/logo {
        # The application accepts 2 MiB of file content and rejects more with
        # its own 422 (`_MAX_BYTES = 2 * 1024 * 1024` in
        # app/api/v1/endpoints/onboarding/logo.py, message "Logo must be 2 MB or
        # smaller."). nginx's stock 1 MB default would 413 a 1.5 MB PNG that the
        # app would have accepted - a bug the frontend cannot diagnose, because
        # the response is nginx HTML with no application error code in it.
        #
        # 3m rather than exactly 2m, for a specific reason beyond "headroom":
        # multipart framing adds boundary and part headers on top of the file
        # bytes, so a file that is exactly at the app's limit is slightly over it
        # on the wire. More importantly, a request between 2 MB and 3 MB now
        # reaches the app and comes back as the app's JSON 422 with a message a
        # user can act on, instead of nginx's HTML 413. The edge limit is here to
        # stop a 500 MB POST, not to enforce the product rule - the app owns that.
        client_max_body_size 3m;

        # An upload is a slow request by nature; the slowloris-tight global
        # client_body_timeout would cut off a genuine 3 MB upload on a weak
        # mobile connection.
        client_body_timeout 60s;

        limit_req zone=cfz_prod_general burst=60 nodelay;

        include snippets/cofoundaz/proxy-backend.conf;
        proxy_pass http://cofoundaz_production;
    }

    # ----------------------------------------------------------------------- #
    # Auth endpoints - the aggressive zone
    # ----------------------------------------------------------------------- #
    location ^~ /api/v1/auth/ {
        # 5r/s with burst 10, per address. A human logging in makes a handful of
        # requests a day; credential stuffing makes hundreds a minute. This is
        # the one place where the edge limit is close enough to real usage to be
        # felt, and that is the intent.
        #
        # `nodelay` returns 429 immediately once the burst is spent, rather than
        # queueing requests and holding sockets - queueing an attack is still
        # paying for it.
        limit_req zone=cfz_prod_auth burst=10 nodelay;

        include snippets/cofoundaz/proxy-backend.conf;
        proxy_pass http://cofoundaz_production;
    }

    # ----------------------------------------------------------------------- #
    # Health probes
    # ----------------------------------------------------------------------- #
    location ^~ /api/v1/health {
        # Off, or an uptime monitor at 30s intervals writes ~2,880 lines a day
        # that bury everything else. Failures still reach the error log.
        access_log off;

        # /api/v1/health/ready touches Postgres and Redis, so it is not free -
        # it stays rate-limited, just on the general zone.
        limit_req zone=cfz_prod_general burst=60 nodelay;

        include snippets/cofoundaz/proxy-backend.conf;
        proxy_pass http://cofoundaz_production;
    }

    # ----------------------------------------------------------------------- #
    # OpenAPI docs - CLOSED on production. This is a policy choice; read before
    # changing it.
    # ----------------------------------------------------------------------- #
    # The application always mounts /api/v1/docs, /api/v1/redoc and
    # /api/v1/openapi.json (app/main.py sets docs_url, redoc_url and
    # openapi_url unconditionally). Closing them is therefore an EDGE decision,
    # and this is the only place it can be made without touching app code.
    #
    # Why closed: the schema is a complete map of every route, parameter and
    # model in the product. It is exactly the reconnaissance an attacker would
    # otherwise have to assemble by hand, and it is the first thing an automated
    # scanner looks for. There is no operational need for it to be public -
    # staging serves the same schema from the same image, so the frontend and
    # any codegen have an authoritative source that costs nothing to expose.
    #
    # 404, not 403: a 403 confirms the path exists. A 404 says nothing.
    #
    # TO OPEN IT: delete this block and copy the docs location from
    # staging-api.cofoundaz.com.conf, which carries the relaxed CSP the Swagger
    # UI page requires. Do not simply delete this block - without that CSP the
    # docs page loads blank, because the strict API CSP above blocks the
    # jsDelivr bundle it needs.
    location ~ ^/api/v1/(docs|redoc|openapi\.json)$ {
        access_log off;
        return 404;
    }

    # ----------------------------------------------------------------------- #
    # Everything else
    # ----------------------------------------------------------------------- #
    location / {
        limit_req zone=cfz_prod_general burst=60 nodelay;

        include snippets/cofoundaz/proxy-backend.conf;
        proxy_pass http://cofoundaz_production;
    }
}
