# Edge-generated errors, in the application's own error envelope.
#   -> /etc/nginx/snippets/cofoundaz/json-errors.conf
#
# Every error the FastAPI app produces has the shape
#
#   {"error": {"code": "...", "message": "...", "field_errors": []}}
#
# (app/core/envelope.py). nginx's stock error pages are HTML. So the one class of
# response a client is guaranteed to be handling badly is the one it only ever
# sees during an incident: the 502 while the API is restarting, the 429 from the
# edge limiter. A frontend that does `await response.json()` on those gets a
# parse error on top of an outage.
#
# These handlers keep the contract intact end to end. `proxy_intercept_errors`
# stays `off` (snippets/cofoundaz/proxy-backend.conf), so a 4xx or 5xx that the
# APPLICATION produced is passed through untouched - only errors nginx generates
# itself are rewritten here.
#
# Each named location re-includes the security headers, because a location with
# its own `add_header` inherits none from the server block.

error_page 413 = @cfz_err_413;
error_page 429 = @cfz_err_429;
error_page 502 = @cfz_err_502;
error_page 503 = @cfz_err_503;
error_page 504 = @cfz_err_504;

# 413 is the one edge error a normal user can trigger by accident, on the logo
# upload. The app's own 2 MB rejection is a 422 with an actionable message; this
# only fires above the edge ceiling, where the request was never going to reach
# the app. Same envelope, so the frontend has one error path.
location @cfz_err_413 {
    internal;
    default_type application/json;
    include snippets/cofoundaz/security-headers-base.conf;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'" always;
    return 413 '{"error":{"code":"PAYLOAD_TOO_LARGE","message":"Request body is too large.","field_errors":[]}}';
}

location @cfz_err_429 {
    internal;
    default_type application/json;
    include snippets/cofoundaz/security-headers-base.conf;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'" always;
    # Matches the app's own 429, which sets Retry-After: 60
    # (app/main.py, _rate_limit_exceeded_handler).
    add_header Retry-After 60 always;
    return 429 '{"error":{"code":"RATE_LIMITED","message":"Too many requests. Slow down a moment.","field_errors":[]}}';
}

# 502 and 504 are kept DISTINCT rather than collapsed into one "unavailable"
# response. They mean different things and lead to different first checks: 502
# is "nothing is listening on the upstream port" (container down, wrong
# API_PORT), 504 is "it accepted the request and took longer than
# proxy_read_timeout" (a slow endpoint or a wedged worker). Flattening them
# would erase that distinction from the client's view and from anything
# aggregating status codes.
location @cfz_err_502 {
    internal;
    default_type application/json;
    include snippets/cofoundaz/security-headers-base.conf;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'" always;
    add_header Retry-After 15 always;
    return 502 '{"error":{"code":"UPSTREAM_UNAVAILABLE","message":"The API is not reachable right now. Try again shortly.","field_errors":[]}}';
}

location @cfz_err_503 {
    internal;
    default_type application/json;
    include snippets/cofoundaz/security-headers-base.conf;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'" always;
    add_header Retry-After 15 always;
    return 503 '{"error":{"code":"SERVICE_UNAVAILABLE","message":"The API is temporarily unavailable. Try again shortly.","field_errors":[]}}';
}

location @cfz_err_504 {
    internal;
    default_type application/json;
    include snippets/cofoundaz/security-headers-base.conf;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'" always;
    return 504 '{"error":{"code":"UPSTREAM_TIMEOUT","message":"The API did not respond in time.","field_errors":[]}}';
}
