# The ACME HTTP-01 challenge path.
#   -> /etc/nginx/snippets/cofoundaz/acme-challenge.conf
#
# Included in the :80 server block of BOTH vhosts, ABOVE the HTTPS redirect.
# Order matters: nginx matches the longest prefix location, so this wins over
# `location /` regardless of position in the file - but writing it first keeps
# the intent obvious to the next reader.
#
# WHY IT MUST NOT BE REDIRECTED:
# certbot's HTTP-01 challenge writes a token file and Let's Encrypt fetches it
# over PLAIN HTTP on port 80. `--webroot` renewals happen with nginx running and
# serving normally, so if `location /` redirects everything to HTTPS, the
# validation request is redirected too. Let's Encrypt does follow the redirect,
# so this often appears to work - right up until the certificate it is renewing
# has expired, at which point the redirect target presents an expired cert, the
# fetch fails, and the renewal fails for the exact reason the renewal existed.
# Serving the challenge directly on :80 removes that dependency entirely.
#
# The webroot directory is shared by both hostnames. That is fine and
# intentional: the token filenames are unguessable and per-challenge, and one
# directory means one thing to create and one thing to get the permissions right
# on.
#
#   sudo mkdir -p /var/www/certbot/.well-known/acme-challenge
#   sudo chown -R www-data:www-data /var/www/certbot
#
# (On nginx.org's packages the worker user is `nginx`, not `www-data`.)

location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type "text/plain";

    # Challenge traffic is not application traffic; keeping it out of the API
    # access log makes a failed renewal easier to spot in the error log.
    access_log off;

    # No security headers, no rate limit. This must answer for Let's Encrypt's
    # validation servers, which retry from several addresses at once and are not
    # something to apply a per-IP budget to.
    try_files $uri =404;
}
