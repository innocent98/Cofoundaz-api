# Security headers common to every response, on both hosts.
#   -> /etc/nginx/snippets/cofoundaz/security-headers-base.conf
#
# DELIBERATELY DOES NOT SET Content-Security-Policy. CSP is the one header that
# genuinely differs by response type here - a JSON API wants `default-src 'none'`,
# the Swagger UI page cannot load at all under it - so whoever includes this file
# adds the CSP that fits. Putting a CSP in here would guarantee one of the two
# call sites is wrong.
#
# EVERY DIRECTIVE CARRIES `always`. Without it, nginx only emits the header on
# 2xx/3xx responses, so a 401, a 429 or a 502 would come back with no security
# headers at all - exactly the responses an attacker is most likely to be
# looking at.
#
# NOTE ON add_header INHERITANCE, because it causes silent regressions:
# add_header is inherited from an outer block ONLY IF the inner block declares no
# add_header of its own. A location that adds a single header therefore loses
# every header set at server level. That is why this file exists as an include
# rather than a server-level block, and why any location with its own CSP must
# include it again.

# Stops content-type sniffing. Without it a browser may decide a JSON response
# that happens to start with `<` is HTML and execute it.
add_header X-Content-Type-Options "nosniff" always;

# Legacy clickjacking control. `frame-ancestors` in the CSP is the modern
# equivalent and both are set: X-Frame-Options for browsers that predate CSP
# level 2, frame-ancestors for everything since.
add_header X-Frame-Options "DENY" always;

# Do not leak the API path a user came from to third-party sites. `no-referrer`
# rather than `strict-origin-when-cross-origin`: an API response has no
# legitimate reason to attribute a referrer to anyone.
add_header Referrer-Policy "no-referrer" always;

# Denies the powerful browser APIs to this origin and to anything it embeds.
# None of them are meaningful for a JSON API; the value is that a future HTML
# response served from this origin cannot quietly acquire them.
add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;

# Opts this origin into cross-origin isolation semantics. On an API the practical
# effect is that a cross-origin document cannot get a usable handle to a window
# opened onto it, and cannot read resources it has no CORS grant for. It does not
# interfere with the app's own CORSMiddleware, which governs XHR/fetch.
add_header Cross-Origin-Opener-Policy "same-origin" always;
#
# `same-site` assumes the browser frontend lives under cofoundaz.com
# (app.cofoundaz.com and api.cofoundaz.com are same-site). CORP is only checked
# for `no-cors` resource loads, not for CORS-mode fetch/XHR, so this does not
# override the app's CORSMiddleware and BACKEND_CORS_ORIGINS. If the frontend
# ever moves to a different registrable domain, change this to `cross-origin` -
# and audit it rather than assuming, because the failure shows up only for
# no-cors loads (an <img> or <script> pointed at an API URL) and is easy to
# misdiagnose as a CORS problem.
add_header Cross-Origin-Resource-Policy "same-site" always;

# Per-host values - see the maps in conf.d/10-hardening.conf for the reasoning,
# particularly on why `preload` is absent.
add_header Strict-Transport-Security $cfz_hsts always;
add_header X-Robots-Tag $cfz_robots always;
