# Everything a `proxy_pass` to the FastAPI app needs, except the upstream name.
#   -> /etc/nginx/snippets/cofoundaz/proxy-backend.conf
#
# Included by every proxying location in both vhosts. The `proxy_pass` line
# itself stays in the location, because that is the only part that differs.
# Six copies of these headers across two files is exactly how one of them ends
# up missing X-Forwarded-Proto and the app starts emailing http:// links.

proxy_http_version 1.1;

# Required for the upstream keepalive pool declared in conf.d/20-upstreams.conf.
# nginx defaults to sending `Connection: close` to upstreams; clearing the header
# is what actually lets the pooled connection be reused.
#
# This app has NO WebSocket routes (verified: no `websocket` or `WebSocket`
# reference anywhere under app/). The usual `map $http_upgrade $connection_upgrade`
# dance is therefore deliberately absent - it would set `Connection: close` on
# every ordinary request and silently disable the pool above. If a WebSocket
# route is ever added, this is the line to revisit, and the keepalive pool is the
# thing it trades against.
proxy_set_header Connection "";

proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header X-Forwarded-Port  $server_port;

# ---------------------------------------------------------------------------
# X-Forwarded-For: $remote_addr, NOT $proxy_add_x_forwarded_for. READ THIS.
# ---------------------------------------------------------------------------
# $proxy_add_x_forwarded_for is the near-universal default, and it is the WRONG
# default at a trust boundary. It APPENDS $remote_addr to whatever the client
# sent, so a request carrying `X-Forwarded-For: 203.0.113.9` leaves nginx as
# `X-Forwarded-For: 203.0.113.9, <real client>`.
#
# That matters because of how uvicorn resolves it. With
# `forwarded_allow_ips="*"`, uvicorn 0.32.1's ProxyHeadersMiddleware returns
# `x_forwarded_for_hosts[0]` - the LEFTMOST value, i.e. the attacker-supplied
# one (verified against the pinned source: uvicorn/middleware/proxy_headers.py,
# `_TrustedHosts.get_trusted_client_host`). Every anonymous request could then
# claim any address it liked, and the application's IP-keyed rate limit on
# login, signup and forgot-password would be defeated by rotating a header.
#
# Overwriting makes the header single-valued, so leftmost == rightmost and the
# question of which end is read stops mattering. It is the version-independent
# fix, and it belongs here rather than in the app because nginx is the only
# component that actually knows the true peer.
#
# THIS IS ONLY CORRECT WHILE NGINX IS THE FIRST HOP. If a CDN or WAF
# (Cloudflare, Fastly) is ever put in front of this host, $remote_addr becomes
# the CDN's address and this line starts discarding the real client. The fix
# then is ngx_http_realip_module - `set_real_ip_from <cdn ranges>` plus
# `real_ip_header CF-Connecting-IP` (or X-Forwarded-For) - so that $remote_addr
# is the true client again. Do NOT solve it by reverting to
# $proxy_add_x_forwarded_for.
proxy_set_header X-Forwarded-For $remote_addr;

# nginx generates a unique id per request; it is in the access log as `rid=`.
# Forwarded so a future correlation-id middleware has it. Nothing in the app
# reads this header today - it is inert, not load-bearing.
proxy_set_header X-Request-ID $request_id;

# ---------------------------------------------------------------------------
# Timeouts
# ---------------------------------------------------------------------------
# Connecting to a process on loopback either succeeds immediately or is not
# listening. 5s is already generous; longer just delays the 502.
proxy_connect_timeout 5s;

proxy_send_timeout 60s;

# 65s, NOT 60s, and the extra five seconds are the whole point. Gunicorn kills a
# worker that has held a request for `--timeout 60`. If nginx also gave up at 60s
# the two would race, and whichever won would decide whether the operator sees a
# useful gunicorn "WORKER TIMEOUT" in the container log or an opaque nginx 504
# with no upstream record at all. Letting gunicorn always fire first keeps the
# diagnosis on the side that knows what the request was doing.
#
# Raising this is almost never the right response to a 504. A 504 means an
# endpoint took over a minute; the fix is in the endpoint.
proxy_read_timeout 65s;

# Do not retry a request that failed after the upstream already accepted it.
# The default (`error timeout`) will re-send a POST that timed out, which for a
# non-idempotent endpoint means the action can happen twice. `off` for anything
# past the initial connection failure; nginx still fails over on a refused
# connect, which is safe because nothing was sent.
proxy_next_upstream off;

# Buffer upstream responses so a slow client cannot occupy a gunicorn worker for
# the length of its download. This is one of the main reasons to have nginx at
# all in front of a synchronous worker pool.
proxy_buffering on;
proxy_buffer_size 8k;
proxy_buffers 8 8k;
proxy_busy_buffers_size 16k;

# Never let the upstream's own error body replace the JSON error pages defined
# in snippets/cofoundaz/json-errors.conf... except that it MUST, because the
# application's 4xx/5xx bodies ARE the API contract. `off` means nginx passes
# the app's JSON envelope straight through and only synthesises a body when the
# app never answered at all (502/504) - which is exactly the split we want.
proxy_intercept_errors off;
