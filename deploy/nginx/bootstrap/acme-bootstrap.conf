# FIRST-RUN ONLY - the chicken-and-egg vhost.
#   -> /etc/nginx/sites-available/acme-bootstrap.conf   (temporarily enabled)
#
# THE PROBLEM THIS SOLVES:
# The two real vhosts declare `ssl_certificate /etc/letsencrypt/live/<host>/...`.
# Those files do not exist until certbot has issued a certificate, and certbot
# cannot issue one until nginx is serving the ACME challenge on port 80. But
# nginx will not START (or reload, or pass `nginx -t`) while a server block
# points at a certificate file that is not there:
#
#   nginx: [emerg] cannot load certificate "/etc/letsencrypt/live/api.cofoundaz.com/fullchain.pem":
#   BIO_new_file() failed (SSL: error:80000002:system library::No such file or directory)
#
# So on a fresh host the real vhosts cannot be enabled first. Enable THIS one
# instead - it has no TLS at all - obtain both certificates through it, then
# swap.
#
# The usual advice is `certbot --nginx`, which edits the config in place. That
# is avoided here on purpose: these files are version-controlled and reviewed,
# and a tool that rewrites them on the box means the repository stops describing
# what is actually running. `--webroot` writes a challenge file and touches
# nothing else.
#
# The exact sequence is in docs/deployment/NGINX_TLS.md section 4. In short:
#
#   sudo ln -s ../sites-available/acme-bootstrap.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot certonly --webroot -w /var/www/certbot -d api.cofoundaz.com
#   sudo certbot certonly --webroot -w /var/www/certbot -d staging-api.cofoundaz.com
#   sudo rm /etc/nginx/sites-enabled/acme-bootstrap.conf
#   # enable the two real vhosts, then nginx -t && systemctl reload nginx
#
# Keep this file in sites-available afterwards. It is also the recovery path if a
# certificate is ever lost or a hostname is added.

server {
    listen 80;
    listen [::]:80;

    # BOTH hostnames in one block. They need nothing but the challenge path at
    # this stage, and one block is one thing to remember to remove.
    server_name api.cofoundaz.com staging-api.cofoundaz.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        # NOT a redirect to HTTPS - there is no HTTPS yet, and redirecting to a
        # port nothing is listening on produces a confusing connection-refused
        # rather than an honest "not ready".
        return 404;
    }
}
