# DEVELOPMENT stack. Not for a VPS.
#
# What makes this a development file, deliberately:
#   - the API source is bind-mounted, so edits are live
#   - Postgres and Redis publish to the host, so psql / redis-cli / pytest /
#     scripts/e2e_run.sh can reach them from your machine
#   - credentials are the well-known throwaway user/password pair
#   - no resource limits, because your laptop is not the constraint
#
# Every one of those is a liability in production. The production stack is
# docker-compose.prod.yml - see docs/deployment/DEPLOYMENT_GUIDE.md.

services:
  api:
    build:
      context: .
      args:
        GIT_SHA: dev
        VERSION: dev
    image: cofoundaz-api:dev
    container_name: cofoundaz-api_api
    # Dev overrides the image's gunicorn CMD with a single reloading uvicorn:
    # gunicorn's prefork model does not reload, and 4 workers on a laptop is
    # just noise. Production uses the image's own CMD.
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
      # Migrations are edited as often as app code in this project; without this
      # you would have to rebuild the image to run a new revision in the container.
      - ./alembic:/app/alembic
    env_file:
      - .env
    environment:
      # Inside the compose network the API reaches Postgres/Redis by SERVICE NAME,
      # not localhost (localhost = the api container itself). These override the
      # host-oriented URLs in .env so the container connects to the sibling services.
      DATABASE_URL: postgresql://user:password@db:5432/cofoundaz-api_db
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      # Use python (always in the image) rather than curl (not installed) so the
      # check reflects the app, not a missing binary. urlopen raises on non-2xx.
      # Liveness only - see /api/v1/health/ready for the dependency-aware check.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  worker:
    build:
      context: .
      args:
        GIT_SHA: dev
        VERSION: dev
    image: cofoundaz-api:dev
    container_name: cofoundaz-api_worker
    command: ["python", "-m", "app.worker"]
    volumes:
      - ./app:/app/app
      - ./alembic:/app/alembic
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://user:password@db:5432/cofoundaz-api_db
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    container_name: cofoundaz-api_db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: cofoundaz-api_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Published so pytest (TEST_DATABASE_URL) and scripts/e2e_run.sh can reach
      # it from the host. Development only - the production stack must never
      # publish Postgres.
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d cofoundaz-api_db"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: cofoundaz-api_redis
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
