services:
  api:
    build: .
    container_name: cofoundaz-api_api
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
    env_file:
      - .env
    environment:
      # Inside the compose network the API reaches Postgres/Redis by SERVICE NAME,
      # not localhost (localhost = the api container itself). These override the
      # host-oriented URLs in .env so the container connects to the sibling services.
      DATABASE_URL: postgresql://user:password@db:5432/cofoundaz-api_db
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - db
      - redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  db:
    image: postgres:17-alpine
    container_name: cofoundaz-api_db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: cofoundaz-api_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: cofoundaz-api_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  postgres_data:
