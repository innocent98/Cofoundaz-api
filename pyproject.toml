[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "cofoundaz-api"
version = "0.1.0"
description = "A FastAPI project"
authors = ["Adebayo Tosin <hello@beyrictech.com>"]
readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.11"
# Lower bound: 0.133.0 is the FIRST release that drops the starlette upper bound
# (0.128.3 still capped at <1.0.0, so it cannot reach the fixed starlette).
# Verified against PyPI metadata for every fastapi release from 0.115.0 up.
#
# Upper bound: fastapi 0.137.0 introduced `_IncludedRouter`, which wraps routes
# registered via `include_router()` in a container object instead of flattening
# them into `app.routes`. slowapi's SlowAPIMiddleware resolves the current
# endpoint by iterating `app.routes` and matching entries that expose
# `.endpoint`; a `_IncludedRouter` exposes neither, so from 0.137.0 onward EVERY
# route under `include_router` became invisible to it and silently lost rate
# limiting - for this app the entire /api/v1 surface, auth included.
#
# That is now FIXED IN-TREE by app/core/rate_limit.py, which teaches slowapi to
# descend `_IncludedRouter` (upstream has not shipped a fix: slowapi 0.1.10 is
# still broken, laurentS/slowapi#281 is open with three unmerged PRs). The
# ceiling therefore moves from <0.137.0 to <0.142.0.
#
# Measured on 0.141.1 + starlette 1.6.0 after the fix, 130 requests against a
# 120/minute limit on an include_router-mounted /api/v1 route:
#   uvicorn, 1 worker  -> first 429 at request 121  (user key AND anon IP key)
#   gunicorn, 4 workers -> first 429 at request 481 (4 x 120; MemoryStorage is
#                          per-worker, so the effective limit is workers x limit)
# Before the fix, the same drive produced 0 x 429.
#
# THE CEILING IS STILL BOUNDED ON PURPOSE. The fix leans on FastAPI internals
# (`_IncludedRouter._match`), so a future minor could move it again. Bounding it
# means Dependabot proposes 0.142 as its own reviewed PR, where
# tests/api/test_rate_limit.py and the boot-time self-check in
# app/core/rate_limit.py must both pass before it can land. Raising the ceiling
# without those passing is how this silently broke the first time.
#
# Range rather than caret: Poetry's caret on a 0.x version pins the MINOR
# (^0.133.0 == >=0.133.0,<0.134.0), which would block ordinary patch upgrades.
fastapi = ">=0.133.0,<0.142.0"
# Declared DIRECTLY, though it arrives via fastapi, to make the security floor
# explicit and enforceable: starlette < 1.3.1 carries 9 advisories
# (PYSEC-2026-161/1941/1942/2280/2281/248/249). 1.3.1 is the highest fix version
# required among them. Do not lower this floor.
starlette = ">=1.3.1,<2.0.0"
# uvicorn 0.30.0 deprecated `uvicorn.workers`, but 0.52.4 STILL SHIPS IT and the
# production Dockerfile CMD depends on it (--worker-class
# uvicorn.workers.UvicornWorker). Verified by import against 0.52.4. If a future
# uvicorn finally removes it, the container fails to boot - `make image-check`
# runs the image's real CMD and is the gate that catches that.
uvicorn = {extras = ["standard"], version = "^0.52.4"}
pydantic = "^2.11.0"
pydantic-settings = "^2.9.0"
python-multipart = ">=0.0.32,<0.1.0"
python-dotenv = "^1.1.0"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
bcrypt = "^4.0.1"
sqlalchemy = "^2.0.41"
alembic = "^1.15.0"
loguru = "^0.7.3"
# FLOOR IS THE VERIFIED VERSION, NOT THE OLD ONE. Dependabot proposed
# ">=0.6,<1.2", which leaves emails 0.6 resolvable - the exact version whose
# untyped mail_from contract app/platform/email.py was fixed for. A resolver
# picking it again would silently reintroduce the From-less message bug.
emails = ">=1.1.2,<1.2"
jinja2 = "^3.1.6"
email-validator = "^2.2.0"
# Only reached transitively, via starlette's TestClient - no app code constructs
# an httpx client, so 0.28's removals (`proxies=`, `app=`) do not apply here.
httpx = "^0.28.1"
python-dateutil = "^2.8.2"
gunicorn = ">=23,<27"
psycopg2-binary = "^2.9.10"
redis = "^5.0.0"
slowapi = "^0.1.9"
pyotp = "^2.10.0"
cryptography = "^50.0.0"

[tool.poetry.group.dev.dependencies]
# Floors are the versions actually verified on this tree, not the superseded ones
# dependabot's widened ranges left resolvable. Ceilings are dependabot's, so it can
# still propose the next major. A floor below the locked version means a fresh
# `poetry lock` can pick a formatter or linter that disagrees with CI.
pytest = "^8.3.0"
pytest-asyncio = ">=1.4,<1.5"
pytest-cov = ">=7.1,<8"
pytest-mock = "^3.14.0"
black = ">=26.5.1,<27.0"
flake8 = "^7.1.0"
mypy = ">=2.3.1,<3.0"
isort = ">=6.1,<7.0"
pylint = ">=4.0.7,<5.0"
pre-commit = "^4.0.0"
ipython = ">=9.17,<10.0"
ruff = ">=0.16.5,<0.17"
bandit = "^1.9.4"
radon = "^6.0.1"

[tool.poetry.scripts]
start = "app.main:start"

[tool.black]
line-length = 100
target-version = ["py311"]
include = "\\.pyi?$"
exclude = '''
/(
    \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
    | alembic
)/
'''

[tool.isort]
profile = "black"
line_length = 100
skip = [".git", ".venv", "alembic"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true
exclude = ["alembic/"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".git", ".venv", "alembic"]

[tool.ruff.lint]
# C90 = mccabe cyclomatic complexity (rule C901). Enforced here rather than via a
# separate tool so there is exactly ONE complexity gate, running in the existing
# lint job at no extra cost. radon is used for REPORTING (cc/mi summaries in the
# quality job); ruff is what actually blocks.
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "C90"]
ignore = ["E501"]

[tool.ruff.lint.mccabe]
# Measured on the tree this gate was introduced against: exactly ONE function
# exceeded 10 -- `validate_answer` in app/services/assessment/engine.py at 11.
# Everything else was at or below 9, and radon puts the whole-codebase average
# at A (2.30) with every module's maintainability index rated A. The gate was
# therefore set at 12: one notch above the worst, unreachable without writing
# something more tangled than anything then in the codebase.
#
# RAISED 12 -> 13 (2026-08-27, Adebayo's call). Module 04 Today's Mission
# (PR #17) merged to main while the PR introducing this gate was open, bringing
# `get_or_generate_today` in app/services/mission/service.py at 13. The gate
# caught it exactly as intended -- but refactoring another module's
# freshly-merged logic inside a deployment PR is the wrong place for it, so the
# ceiling moved instead.
#
# Be aware of what that trades away: a ceiling raised to whatever most recently
# landed is a ratchet, and the next function at 14 has the same argument
# available to it. Two follow-ups keep this honest, and neither should be
# quietly dropped:
#   1. refactor `get_or_generate_today` back under 12, then restore this to 12
#   2. refactor `validate_answer`, which is the only thing between the tree and
#      ruff's common default of 10
max-complexity = 13

[tool.pylint.main]
# alembic is generated/templated code and is excluded from every other linter here.
ignore = ["alembic"]
# pylint is slow single-threaded; use all cores in CI.
jobs = 0

[tool.pylint."messages control"]
# pylint runs ALONGSIDE ruff/black/mypy, so anything those already own is turned
# off here. Left on, they produced 512 of 527 messages -- noise that trains people
# to ignore the tool. Each disable is a deliberate, justified choice:
#
#   C0114/C0115/C0116  missing docstrings (324 msgs). This codebase documents the
#                      non-obvious with block comments rather than blanket
#                      docstrings. Enforcing them now means 324 stub docstrings,
#                      which is worse than none.
#   C0103              invalid-name (64). ruff's `N` ruleset already enforces
#                      naming, and pylint objects to pydantic Settings' ALL_CAPS
#                      fields, which are required by that library.
#   C0301              line-too-long (12). black owns line length (100).
#   R0903              too-few-public-methods (41). SQLAlchemy models and pydantic
#                      schemas legitimately have no public methods.
#   W0613              unused-argument (32). FastAPI injects dependencies that a
#                      handler may not reference by name.
#   R0801              duplicate-code (6). Fires on structurally identical ORM
#                      column declarations across models, which is the correct
#                      way to write them.
#   E1136/E1102        SQLAlchemy 2.0 false positives -- astroid cannot resolve
#                      `Mapped[...]` subscripting or the dynamic `func.now`
#                      namespace. Both are library limitations, not defects.
#   C0415              import-outside-toplevel (8). Deliberate lazy imports.
disable = [
    "C0114", "C0115", "C0116",
    "C0103",
    "C0301",
    "R0903",
    "W0613",
    "R0801",
    "E1136", "E1102",
    "C0415",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = "-v --strict-markers --cov=app --cov-report=term-missing --cov-report=html"
filterwarnings = [
    # Third-party py3.14 asyncio DeprecationWarnings from pytest_asyncio/fastapi/slowapi
    # internals (the venv runs Python 3.14; the project targets 3.11). These flood the
    # run and aren't actionable from app code. First-party `app.*` warnings are left
    # visible (no blanket "ignore::DeprecationWarning").
    "ignore:.*iscoroutinefunction.*:DeprecationWarning",
    "ignore:.*get_event_loop_policy.*:DeprecationWarning",
]

[tool.coverage.run]
source = ["app"]
omit = ["app/main.py", "alembic/*"]
